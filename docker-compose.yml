# Local build/test stack for app_skeleton — the same app image this
# produces is what Internal Prod, every External Client instance, and the
# dev droplet's own local test stack run (see
# stack.xten.au/VPS-Two-Droplet-Deploy-Plan.md). Actual prod/client
# deploys pull a pre-built, tagged image rather than building here — this
# file is for local iteration and for the dev droplet's pre-prod testing.
#
# First-time setup (see docker/entrypoint.sh for why):
#   mkdir -p data && touch data/encryption_key
#   cp .env.example .env   # then fill in real values
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-app_skeleton}
      DB_USER: ${DB_USER:-app_skeleton}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Optional — mail() has no MTA to relay through until these are set
      # (existing, pre-2026-07-30 behavior: send fails, gets logged, request
      # still succeeds). Empty defaults rather than a required ${VAR:?...}
      # since local dev shouldn't need real mail credentials just to run
      # the stack.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - ./data/encryption_key:/app/.encryption_key
      - ./data/files:/app/public/files
      - ./data/logs:/app/logs
      # Sessions (app/config/services.php sets savePath to BASE_PATH .
      # '/sessions', not PHP's ini-configured session.save_path — the app
      # uses its own Stream adapter). Every deploy does a full container
      # recreate (`docker compose up -d --build`), which wipes anything
      # not bind-mounted. Without this, every deploy silently logs
      # everyone out and invalidates any in-flight CSRF token, which read
      # as a recurring, unfixable "session expired" bug rather than what
      # it actually was: normal redeploys during active testing (found
      # 2026-08-01, session 10).
      - ./data/sessions:/app/sessions
      # Ticket attachments — deliberately NOT under public/files (see
      # migration 013_ticket_attachments.sql and
      # TicketsController::downloadAttachmentAction): attachments can
      # contain sensitive content (e.g. a customer's phpinfo() dump), so
      # they're served through an authenticated action rather than Caddy's
      # static file_server, and this mount is app-only — no caddy mount.
      - ./data/ticket-attachments:/app/storage/ticket-attachments
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Default to non-privileged local ports so this doesn't fight
      # anything already on :80/:443 during local dev. Real deployments
      # (see .env.example) map to the real ports — Let's Encrypt's
      # HTTP-01/TLS-ALPN-01 challenges specifically require 80/443 exactly,
      # automatic HTTPS won't work on any other port.
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Static assets (css/js/img) come straight from the host repo's
      # public/ — the more specific mount below overrides just the
      # files/ subpath with the same host dir the app container writes
      # uploads into, so avatars show up without duplicating that data.
      # The outer mount can't be :ro — Docker needs to create the inner
      # mount's mountpoint directory inside it, which fails against an
      # already-read-only parent mount even though the dir exists on the
      # host (verified 2026-07-30). Caddy has no reason to write here
      # regardless, so this isn't a meaningful loosening.
      - ./public:/app/public
      - ./data/files:/app/public/files:ro
      - caddy_data:/data
    depends_on:
      - app

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-app_skeleton}
      POSTGRES_USER: ${DB_USER:-app_skeleton}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      # Bound to loopback only — lets the host's own psql/pg_dump (see
      # docker/backup-db.sh) reach the database directly, without
      # exposing Postgres beyond the machine itself. Never publish this
      # without the 127.0.0.1 prefix.
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18's image changed its expected layout — it wants a
      # single mount at /var/lib/postgresql (manages its own
      # version-specific subdirectory beneath it, pg_ctlcluster-style),
      # not the older .../data convention. Verified 2026-07-30: the
      # container refuses to start at all against the old path, even with
      # a freshly-created empty volume.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app_skeleton}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  caddy_data:
