# Isolated marketing-system instance, sharing stack-prod's edge Caddy
# (app_skeleton_default network) rather than running a second reverse
# proxy - ports 80/443 are already owned by the primary instance's Caddy
# container. This app + its db are otherwise fully separate: own
# containers, own database, own volumes.
services:
  app:
    build:
      context: .
      additional_contexts:
        internal-modules: ../internal
    restart: unless-stopped
    # Container logs default to unbounded — on a long-running droplet
    # that fills the disk eventually. Capped the same way on both
    # services below.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - ./data/encryption_key:/app/.encryption_key
      - ./data/files:/app/public/files
      - ./data/logs:/app/logs
      - ./data/sessions:/app/sessions
      - ./data/ticket-attachments:/app/storage/ticket-attachments
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - shared_edge

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Loopback-only — reachable solely via an SSH-tunneled GUI client
    # (e.g. TablePlus) from the droplet's own localhost, never the public
    # internet. POSTGRES_HOST_AUTH_METHOD is `trust` (no exposed host
    # port when this was set, so a password added no real protection —
    # see docker-compose git history), so this bind address is the only
    # thing standing between this database and anyone who can reach port
    # 5433. Do not change 127.0.0.1 to 0.0.0.0 or drop it entirely.
    #
    # Host port is 5433, not Postgres's default 5432 -- 5432 is already
    # permanently owned by the main production instance's own database
    # (app_skeleton-db-1, a separate container, separate database
    # entirely), found the hard way when this one failed to bind
    # 2026-08-27.
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  default:
  shared_edge:
    external: true
    name: edge_shared

volumes:
  db_data:
