name: Mirror main to dev

# Keeps `dev` an exact, always-current copy of `main`, so the Azure "cptest"
# test pipeline (main_cptest.yml, triggered on push to `dev`) always builds
# current code without being wired directly to `main` itself — see
# docs/module-system-design-brief.md-adjacent session notes (Session 10,
# 2026-08-01) for why: Azure's Deployment Center has full push/admin access
# to this repo and has already committed its own workflow file straight to
# `main` twice. `dev` exists purely as Azure's target; don't commit to it
# directly, anything pushed there gets overwritten on the next `main` push.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force dev to match main
        run: git push origin HEAD:refs/heads/dev --force

      - name: Trigger the Azure test build on dev
        # A push made with the default GITHUB_TOKEN (the line above) does not
        # itself trigger other workflows — GitHub suppresses that to prevent
        # recursive runs. main_cptest.yml's push-on-dev trigger would
        # otherwise never fire, so kick it explicitly via its
        # workflow_dispatch trigger instead.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main_cptest.yml --ref dev
