# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - cptest

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        # --no-scripts: composer.json's post-install-cmd runs bin/install.php,
        # which requires a live, reachable Postgres to apply migrations/seed
        # data — there's no database in this CI job (same reason the
        # Dockerfile's own composer install uses --no-scripts). Migrations
        # for the deployed Azure app still need their own solution; this
        # only gets the package-install step itself passing.
        run: composer validate --no-check-publish && composer install --prefer-dist --no-progress --no-scripts


      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_38657D8571374082A0EAB1D459E65B9A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2025748004DC416E8E49A612D767115A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6F9BDE9BF2DB4C36BE93F819DA01190F }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'cptest'
          slot-name: 'Production'
          package: .
          