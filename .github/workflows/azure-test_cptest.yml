# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - cptest

on:
  push:
    branches:
      - azure-test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        # --no-scripts: composer.json's post-install-cmd runs bin/install.php,
        # which requires a live, reachable Postgres to apply migrations/seed
        # data — there's no database in this CI job (same reason the
        # Dockerfile's own composer install uses --no-scripts). Migrations
        # for the deployed Azure app still need their own solution.
        #
        # --ignore-platform-req=ext-phalcon: this generic ubuntu-latest +
        # setup-php runner has no way to have the Phalcon extension
        # installed — it's a compiled C extension only available via
        # sury.org's custom package, which is exactly why this repo's own
        # Dockerfile builds a custom PHP-FPM image from source rather than
        # using a stock one (see Dockerfile's top comment). Same flag,
        # same reason, as that Dockerfile's own composer install step.
        run: composer validate --no-check-publish && composer install --prefer-dist --no-progress --no-scripts --ignore-platform-req=ext-phalcon


      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      # Publish-profile auth (static credential, no Azure AD app
      # registration or branch-subject matching) instead of azure/login's
      # OIDC federation — that kept failing with AADSTS700213 even after a
      # Deployment Center disconnect/reconnect, so this sidesteps it
      # entirely. See Session 10 notes (2026-08-01).
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'cptest'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
