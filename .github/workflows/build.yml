name: Build

# What "build passing" actually means here: the same Docker image that
# Internal Prod and every client instance run builds successfully, boots
# the full stack (Caddy + app + Postgres) against a stock .env.example
# config, actually serves real HTTP responses, AND passes the PHPUnit
# suite (see docs/CONTRIBUTING.md's Testing section) — Unit tests
# against a real Postgres connection, Feature tests as real HTTP
# requests against this exact running stack, not mocks either way.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against the private module leaking into composer.lock
        # composer.local.json (gitignored, see docs/INTERNAL-MODULES.md)
        # merges a `path` repository (`../internal/*`) into composer.json's
        # effective require set on any machine that has it checked out.
        # Running `composer update`/`composer require` on such a machine
        # bakes a `dist.type: path` entry for the private module straight
        # into composer.lock — and since composer.lock IS committed (unlike
        # composer.local.json itself), that entry silently rides along into
        # the public repo. This has recurred multiple times (REQ-098 and
        # repeats) because nothing caught it before merge. A fresh clone/CI/
        # a droplet without ../internal present can't resolve that path,
        # which is exactly the "composer.lock regression" fix commits kept
        # re-applying by hand.
        run: |
          if grep -q "xtenstack/requirements-module\|\.\./internal" composer.lock; then
            echo "::error::composer.lock references the private ../internal path repo (xtenstack/requirements-module)." >&2
            echo "This means composer.lock was regenerated on a machine with composer.local.json present and committed as-is." >&2
            echo "Fix: remove composer.local.json (or run 'composer update' without it) and regenerate composer.lock before committing." >&2
            exit 1
          fi

      - name: Set up .env and required bind-mount targets
        run: |
          cp .env.example .env
          echo "DB_PASSWORD=ci-only-not-a-real-secret" >> .env
          mkdir -p data
          touch data/encryption_key
          # docker-compose.yml's internal-modules build context needs this
          # sibling directory to exist even empty (see docs/INTERNAL-MODULES.md)
          # — CI has no private module checkout, same as a public clone.
          mkdir -p ../internal

      - name: Build and start the real stack
        run: docker compose up -d --build

      - name: Wait for the app to become reachable
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8080/; then
              echo "app reachable after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "app never became reachable" >&2
          exit 1

      - name: Smoke-test real endpoints
        run: |
          set -e
          # Guest landing page (backend/index) — served, not an error page.
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)
          [ "$status" = "200" ] || { echo "landing page: expected 200, got $status" >&2; exit 1; }

          # Login page — same check, confirms the backend module and Volt
          # rendering both actually work, not just the router.
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/backend/session)
          [ "$status" = "200" ] || { echo "login page: expected 200, got $status" >&2; exit 1; }

          # A mistyped/unmatched URL should hit the themed 404, not a
          # leaked JSON error or a raw crash (REQ-024/REQ-026).
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/this-route-does-not-exist)
          [ "$status" = "404" ] || { echo "unmatched route: expected 404, got $status" >&2; exit 1; }

      - name: Install PHPUnit + its dependencies inside the running app container
        # The runtime image deliberately excludes dev deps (Dockerfile's
        # vendor stage: `composer install --no-dev`) and deliberately
        # purges curl/composer after its own apt-time use — smaller attack
        # surface for what's actually deployed. Reinstalling both here is
        # CI-only: this exact container is torn down at the end of this
        # job (see "Tear down" below), never pushed or deployed anywhere.
        # php8.3-xml is PHPUnit's own requirement (dom/xmlwriter), not
        # this app's — sury's php8.3-phalcon meta-package doesn't pull it
        # in. unzip is for Composer itself: no zip extension either, and
        # without unzip present it can't fetch nette/utils' dist archive
        # (a transitive phpunit dep) — confirmed as the actual failure on
        # the first real Actions run of this step (build 30966499003),
        # not assumed from the local dry run alone.
        run: |
          docker compose exec -T -u root app sh -c "apt-get update -qq && apt-get install -y -qq curl unzip php8.3-xml"
          docker compose exec -T app sh -c "curl -sS https://getcomposer.org/installer | php -- --install-dir=/tmp --filename=composer.phar"
          docker compose exec -T app php /tmp/composer.phar install --ignore-platform-req=ext-pdo_pgsql

      - name: Run PHPUnit
        run: docker compose exec -T app vendor/bin/phpunit

      - name: Set up Node for Playwright
        # Playwright runs on the runner itself (needs a real browser),
        # not inside the app container the way PHPUnit does — hits the
        # same localhost:8080 the "Wait for the app" step above already
        # confirmed reachable, over the Caddy port Docker Compose
        # publishes to the host. E2E test (project audit Fix Kit,
        # 2026-08-11, Tier 3) is the one addition Node/npm make to this
        # project's toolchain — not a runtime dependency of the app
        # itself, which stays 100% PHP; nothing on prod or the dev
        # droplet needs Node for this.
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright + browsers
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Dependency vulnerability audit
        # Advisory first pass (project audit Fix Kit, 2026-08-11) — this
        # hasn't run before and may surface pre-existing advisories that
        # need triage before the build can safely fail on them. Flip
        # continue-on-error off once a clean baseline is confirmed.
        run: docker compose exec -T app php /tmp/composer.phar audit
        continue-on-error: true

      - name: Show app container logs on failure
        if: failure()
        run: docker compose logs app

      - name: Tear down
        if: always()
        run: docker compose down -v
