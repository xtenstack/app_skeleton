name: Mirror main to azure-test

# Keeps `azure-test` an exact, always-current copy of `main`, so the Azure
# "cptest" test pipeline (main_cptest.yml, triggered on push to
# `azure-test`) always builds current code without being wired directly to
# `main` itself — see Session 10 notes (2026-08-01) for why: Azure's
# Deployment Center has full push/admin access to this repo and has
# already committed its own workflow file straight to `main` twice.
# `azure-test` exists purely as Azure's target; don't commit to it
# directly, anything pushed there gets overwritten on the next `main` push.
# Deliberately not named `dev` — that name is reserved for whatever this
# project's own release/development branching ends up being, a separate
# decision from "which branch does Azure watch."
on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force azure-test to match main
        run: git push origin HEAD:refs/heads/azure-test --force

      - name: Trigger the Azure test build on azure-test
        # A push made with the default GITHUB_TOKEN (the line above) does not
        # itself trigger other workflows — GitHub suppresses that to prevent
        # recursive runs. main_cptest.yml's push-on-azure-test trigger would
        # otherwise never fire, so kick it explicitly via its
        # workflow_dispatch trigger instead.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main_cptest.yml --ref azure-test
