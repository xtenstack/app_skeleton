# Internal Prod only — layer this on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# This stack's Caddy also fronts xtmk.xten.au (xten-marketing),
# reverse-proxying to that sibling stack's app container over the
# external `edge_shared` Docker network — one shared front door on
# :80/:443 for both apps on that droplet, rather than two Caddy
# instances fighting over the same ports. `edge_shared` is created once,
# outside either stack (`docker network create edge_shared`), and both
# docker-compose projects join it; xten-marketing's own compose file
# needs the matching network wiring for `xten-marketing-app-1` to be
# reachable by name from here.
#
# Split out of the base docker-compose.yml (2026-09-02, Modules Session
# 2) rather than committed inline: `edge_shared` is declared `external:
# true`, which makes Compose refuse to start at all — not just skip the
# network — on any machine that doesn't already have it (every dev
# laptop, CI, every client droplet). Baking it into the file every
# environment uses would have broken all of them the next `docker
# compose up`, this repo's own CI included. This file only applies where
# it's explicitly requested with `-f`.
# The actual shared Caddy container (reading xten-marketing's static
# assets via the /opt/xten-marketing/public bind mount, proxying
# xtmk.xten.au to xten-marketing-app-1 over edge_shared) is defined in
# app_skeleton's own docker-compose.prod.yml, not here -- this project
# never runs its own caddy service (confirmed: only
# app_skeleton-caddy-1 exists, no xten-marketing-caddy-1). A `caddy:`
# stanza used to be duplicated here with no image/build of its own,
# which made `docker compose -f ... -f docker-compose.prod.yml up
# --build` fail outright ("service caddy has neither an image nor a
# build context") -- removed 2026-09-07.
services:
  app:
    networks:
      - default
      - edge_shared

networks:
  default:
  edge_shared:
    external: true
