          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: A valid ?email= is required
  /marketing/api-contacts/redirect:
    post:
      tags:
        - Marketing Contacts
      operationId: mkt_api_contacts_redirect
      summary: Dead-mailbox redirect
      description: 'Tim''s "this mailbox is closing, email X instead" rule. Steps: (1) every ABN that has old_email as an email contact gets each replacement registered as a preferred contact (extraction_method autoresponder_redirect; existing ones just get fetched_at and preferred refreshed); (2) old_email is suppressed at ADDRESS scope (added to the global unsubscribes list, its pending/sent sends marked bounced, each membership it was closing re-opened as "not contacted" if the ABN has another usable unsuppressed email, otherwise set "unsubscribed"). Address scope means the inbox is dead, not that the person opted out; contrast api-unsubscribes/create with scope "entity". Replacements on a different domain than old_email are rejected (listed in rejected[]) unless allow_cross_domain is true, because that usually names a different business. Replacements that are invalid or equal to old_email are also rejected. Idempotent: re-posting refreshes contacts and re-runs the membership pass. Returns 201 even when old_email was already suppressed or matched no ABN (check already_suppressed / abns). Callers: roles admin or agent only (API key via X-Api-Key or Authorization: Bearer, or a logged-in browser session; no CSRF check). The router accepts any HTTP method for this URL; the action returns 405 unless the method is POST.'
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MktRedirectRequest'
            example:
              old_email: info@example.invalid
              new_emails:
                - sales@example.invalid
              reason: dead mailbox autoresponder
              allow_cross_domain: false
      responses:
        '201':
          description: Redirect applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktRedirectResult'
              example:
                old_email: info@example.invalid
                already_suppressed: false
                new_emails:
                  - sales@example.invalid
                rejected:
                  - email: x@other.example.invalid
                    why: different domain
                abns:
                  - '11111111111'
                contacts_added: 1
                memberships: 1
                members_reopened: 1
                members_unsubscribed: 0
                sends_bounced: 1
        '401':
          description: No valid session or API key (revoked, expired, unknown key, or owning user inactive).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: Not authenticated
        '403':
          description: Authenticated, but the caller holds none of the roles admin or agent (operator, charter_agent and member are refused).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: Forbidden
        '405':
          description: Non-POST request to a write action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: POST required
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: a valid old_email is required
  /marketing/api-contacts/replied:
    post:
      tags:
        - Marketing Contacts
      operationId: mkt_api_contacts_replied
      summary: Record a reply (Tim write-back)
      description: 'Moves every campaign membership the address was sent to (campaign_sends with status sent) or is an email contact for, from "not contacted"/"sent" to "replied", and appends a stamped note. Automated reply types (out_of_office, bounce_text) are noted only and never change outreach_status. Statuses already past replied (unsubscribed, call booked, quoted, won, lost, no) are never overwritten; those memberships get the note only. This endpoint does not suppress anything: for an opt-out also call api-unsubscribes/create, even when reply_type is "unsubscribe". Idempotent (the note is not re-appended once present, and already-replied memberships only get the note step). Always 200 on success, including when no membership matches (memberships 0). Callers: roles admin or agent only (API key via X-Api-Key or Authorization: Bearer, or a logged-in browser session; no CSRF check). The router accepts any HTTP method for this URL; the action returns 405 unless the method is POST.'
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MktRepliedRequest'
            example:
              email: owner@example.invalid
              reply_type: interested
              note: Asked for a quote
              source: tim
      responses:
        '200':
          description: Reply recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktRepliedResult'
              example:
                email: owner@example.invalid
                reply_type: interested
                memberships: 2
                marked_replied: 1
                noted_only: 1
                kept_statuses:
                  quoted: 1
        '401':
          description: No valid session or API key (revoked, expired, unknown key, or owning user inactive).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: Not authenticated
        '403':
          description: Authenticated, but the caller holds none of the roles admin or agent (operator, charter_agent and member are refused).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: Forbidden
        '405':
          description: Non-POST request to a write action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: POST required
        '422':
          description: Invalid email or unknown reply_type (the latter also lists the allowed values).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MktError'
                  - $ref: '#/components/schemas/MktReplyTypeError'
              example:
                error: unknown reply_type
                reply_types:
                  - interested
                  - not_now
                  - unsubscribe
                  - out_of_office
                  - bounce_text
                  - replied
  /marketing/api-leads/index:
    get:
      tags:
        - Marketing Leads
      operationId: mkt_api_leads_index
      summary: List leads
      description: 'Newest first, always paged by limit/offset (the table has ~half a million rows; unpaged responses used to exhaust memory). An unrecognised status value is ignored rather than rejected. Callers: roles admin or agent only (API key via X-Api-Key or Authorization: Bearer, or a logged-in browser session; no CSRF check). The router accepts any HTTP method for this URL; the action does not check the method, GET is the intended one.'
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by status; values outside the enum are silently ignored.
          schema:
            type: string
            enum:
              - new
              - matched
              - contacted
              - converted
              - declined
        - name: abn
          in: query
          required: false
          description: Exact ABN match.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size, clamped to 1..1000.
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          required: false
          description: Rows to skip (negative becomes 0).
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Page of leads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktLeadList'
              example:
                total: 1
                limit: 100
                offset: 0
                leads:
                  - id: 5
                    source: api
                    product: null
                    name: Example Person
                    org: Example Pty Ltd
                    email: person@example.invalid
                    phone: null
                    system_desc: null
                    notes: null
                    abn: null
                    status: new
                    created_at: '2026-10-01 09:00:00'
        '401':
          description: No valid session or API key (revoked, expired, unknown key, or owning user inactive).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: Not authenticated
        '403':
          description: Authenticated, but the caller holds none of the roles admin or agent (operator, charter_agent and member are refused).
          content:
