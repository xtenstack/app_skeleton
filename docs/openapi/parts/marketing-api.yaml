          type: string
          nullable: true
          description: added_at (Postgres timestamp, "YYYY-MM-DD HH:MM:SS", no timezone).
          example: '2026-10-01 09:00:00'
        status_changed:
          type: string
          nullable: true
          description: status_changed (Postgres timestamp, "YYYY-MM-DD HH:MM:SS", no timezone).
          example: '2026-10-01 09:00:00'
        best_contact_kind:
          type: string
          nullable: true
          description: email, phone etc.
        best_contact_value:
          type: string
          nullable: true
          description: Best contact (suppressed emails are skipped when picking).
        best_contact_person_name:
          type: string
          nullable: true
          description: Contact person.
    MktProspectEnvelope:
      type: object
      properties:
        prospect:
          $ref: '#/components/schemas/MktProspect'
      required:
        - prospect
    MktProspectList:
      type: object
      properties:
        prospects:
          type: array
          items:
            $ref: '#/components/schemas/MktProspect'
        page:
          type: integer
          description: Page.
        total_pages:
          type: integer
          description: Total pages.
        total:
          type: integer
          description: Total rows.
        per_page:
          type: integer
          description: Page size.
      required:
        - prospects
        - page
        - total_pages
        - total
        - per_page
    MktProspectUpdate:
      type: object
      properties:
        outreach_status:
          type: string
          description: Stamps status_changed when changed.
          enum:
            - not contacted
            - sent
            - replied
            - call booked
            - quoted
            - won
            - lost
            - 'no'
        priority:
          type: integer
          nullable: true
          minimum: 0
          maximum: 10
          description: null or 0-10.
        first_paragraph:
          type: string
          nullable: true
          description: Text or null.
        notes:
          type: string
          nullable: true
          description: Text or null.
    MktUnsubscribe:
      type: object
      properties:
        email:
          type: string
          description: Lower-cased address.
        campaign_code:
          type: string
          nullable: true
          description: Campaign it came from (informational; suppression is global).
        reason:
          type: string
          nullable: true
          description: Reason.
        unsubscribed_at:
          type: string
          nullable: true
          description: unsubscribed_at (Postgres timestamp, "YYYY-MM-DD HH:MM:SS", no timezone).
          example: '2026-10-01 09:00:00'
    MktUnsubscribeList:
      type: object
      properties:
        unsubscribes:
          type: array
          items:
            $ref: '#/components/schemas/MktUnsubscribe'
      required:
        - unsubscribes
    MktUnsubscribeRequest:
      type: object
      properties:
        email:
          type: string
          description: Valid email to suppress.
          format: email
        campaign_code:
          type: string
          description: Optional, recorded only.
        reason:
          type: string
          description: Default "phone request".
        scope:
          type: string
          description: Default entity; any other value is treated as entity.
          enum:
            - entity
            - address
          default: entity
        unsubscribe_tokens:
          type: array
          items:
            type: string
            description: Footer token from a quoted email.
        related_emails:
          type: array
          items:
            type: string
            description: 'Quoted To: address.'
            format: email
      required:
        - email
    MktUnsubscribeResult:
      type: object
      properties:
        unsubscribe:
          $ref: '#/components/schemas/MktUnsubscribe'
        already_suppressed:
          type: boolean
        scope:
          type: string
          description: Applied scope.
          enum:
            - entity
            - address
        memberships:
          type: integer
          description: Memberships that used the address.
        members_updated:
          type: integer
          description: Set to unsubscribed.
        members_reopened:
          type: integer
          description: Re-opened (address scope).
        sends_bounced:
          type: integer
          description: Sends marked bounced (address scope).
        events_added:
          type: integer
          description: Send-history event rows written.
        related:
          type: object
          additionalProperties:
            type: string
            enum:
              - suppressed
              - already_suppressed
          description: Originally mailed addresses also suppressed, keyed by address.
    MktPublicLeadRequest:
      type: object
      properties:
        name:
          type: string
          description: Required.
        org:
          type: string
          description: Required.
        email:
          type: string
          description: Required, valid.
          format: email
        phone:
          type: string
          description: Optional.
        system:
          type: string
          description: Stored as system_desc.
        restored:
          type: string
          description: Ever restored a backup?
        notes:
          type: string
          description: Optional.
        product:
          type: string
          description: Optional.
        source:
          type: string
          description: Default "unknown".
        abn:
          type: string
          description: Optional; ignored if invalid or not active.
        company_website:
          type: string
          description: 'Honeypot: must be empty/absent.'
      required:
        - name
        - org
        - email
    MktResendWebhookEvent:
      type: object
      properties:
        type:
          type: string
          description: Resend event type, e.g. email.bounced, email.complained, email.delivered.
        data:
          type: object
          properties:
            email_id:
              type: string
              description: Resend message id, matched to campaign_sends.provider_message_id.
            bounce:
              type: object
              properties:
                type:
                  type: string
                  description: Permanent suppresses; anything else does not.
            bounce_type:
              type: string
              description: Fallback location for the bounce type.
          additionalProperties: true
      required:
        - type
      additionalProperties: true
