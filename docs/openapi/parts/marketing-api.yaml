tags:
  - name: Marketing Addresses
    description: CRUD (no delete) over abn_lookup.addresses, structured postal addresses tied to ABNs or contacts.
  - name: Marketing Campaigns
    description: Read campaigns and change only their send configuration (status, template, daily limit).
  - name: Marketing Claims
    description: Read-only check of whether an email address belongs to someone who claimed a directory listing.
  - name: Marketing Contacts
    description: 'Tim write-backs: dead-mailbox redirects and campaign reply recording, both of which can change outreach state.'
  - name: Marketing Leads
    description: Authenticated lead list, create, update and convert-to-campaign-member.
  - name: Marketing Mail Templates
    description: Create, read and edit the email templates campaigns send.
  - name: Marketing Prospects
    description: Read campaign prospects and update their outreach status, notes, priority and first paragraph.
  - name: Marketing Unsubscribes
    description: 'Global suppression list: check an address or suppress one (entity or address scope).'
  - name: Marketing Public Lead Capture
    description: Public CORS landing-page form that stores a lead and notifies staff.
  - name: Marketing Webhooks
    description: Signed receiver for Resend (Svix) delivery events that marks bounces and suppresses addresses.
paths:
  /marketing/api-addresses/index:
    get:
      tags:
        - Marketing Addresses
      operationId: mkt_api_addresses_index
      summary: List addresses
      description: 'Paged list of rows from abn_lookup.addresses, newest first by default. Callers: roles admin or agent only (API key via X-Api-Key or Authorization: Bearer, or a logged-in browser session; no CSRF check). The router accepts any HTTP method for this URL; the action does not check the method, GET is the intended one.'
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: abn
          in: query
          required: false
          description: Exact ABN match (no normalisation).
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: 'Case-insensitive substring search (ILIKE) over: abn, locality, state_province, postcode, street_name.'
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort key; unknown values fall back to the default (created).
          schema:
            type: string
            enum:
              - created
              - abn
              - locality
              - state
              - postcode
            default: created
        - name: dir
          in: query
          required: false
          description: Sort direction; anything other than asc is treated as desc. NULLs always sort last.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: page
          in: query
          required: false
          description: Page number, clamped into 1..total_pages.
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          required: false
          description: Rows per page (default 25). Not capped in code; 0 or negative values are not guarded (see notes).
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: Page of addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktAddressList'
              example:
                addresses:
                  - id: 1
                    abn: '11111111111'
                    contact_id: null
                    address_type: registered
                    unit: null
                    street_number: '1'
                    street_name: Example
                    street_type: St
                    locality: Perth
                    state_province: WA
                    postcode: '6000'
                    country: AU
                    raw_input: null
                    gnaf_pid: null
                    validation_source: null
                    validated_at: null
                    extraction_method: api
                    created_at: '2026-10-01 09:00:00'
                    updated_at: '2026-10-01 09:00:00'
                page: 1
                total_pages: 1
                total: 1
                per_page: 25
        '401':
          description: No valid session or API key (revoked, expired, unknown key, or owning user inactive).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: Not authenticated
        '403':
          description: Authenticated, but the caller holds none of the roles admin or agent (operator, charter_agent and member are refused).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: Forbidden
