  /marketing/api-prospects/index:
    get:
      tags:
        - Marketing Prospects
      operationId: mkt_api_prospects_index
      summary: List a campaign's prospects
      description: 'Campaign members enriched with qualification score and best contact (view v_campaign_prospects). campaign is required (an unfiltered default once took the app down). Prospects are imported by pipeline, there is no create or delete. Callers: roles admin or agent only (API key via X-Api-Key or Authorization: Bearer, or a logged-in browser session; no CSRF check). The router accepts any HTTP method for this URL; the action does not check the method, GET is the intended one.'
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: campaign
          in: query
          required: true
          description: Campaign code (required).
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by outreach_status. Values outside this list are silently ignored; note "unsubscribed" is a real stored status but is NOT in this list, so it cannot be filtered here.
          schema:
            type: string
            enum:
              - not contacted
              - sent
              - replied
              - call booked
              - quoted
              - won
              - lost
              - 'no'
        - name: q
          in: query
          required: false
          description: 'Case-insensitive substring search (ILIKE) over: abn, main_ent_name, domain, best_contact_value, best_contact_person_name.'
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort key; unknown values fall back to the default (score).
          schema:
            type: string
            enum:
              - score
              - name
              - status
              - updated
              - priority
            default: score
        - name: dir
          in: query
          required: false
          description: Sort direction; anything other than asc is treated as desc. NULLs always sort last.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: page
          in: query
          required: false
          description: Page number, clamped into 1..total_pages.
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          required: false
          description: Rows per page (default 25). Not capped in code; 0 or negative values are not guarded (see notes).
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: Page of prospects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktProspectList'
        '401':
          description: No valid session or API key (revoked, expired, unknown key, or owning user inactive).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: Not authenticated
        '403':
          description: Authenticated, but the caller holds none of the roles admin or agent (operator, charter_agent and member are refused).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: Forbidden
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: campaign query param is required
