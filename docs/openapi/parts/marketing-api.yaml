  /marketing/api-claims/index:
    get:
      tags:
        - Marketing Claims
      operationId: mkt_api_claims_index
      summary: Who has claimed a directory listing under an email address
      description: 'Read-only lookup in directory.claimed_profiles for Tim and other agents: a message from a claimed customer is a human matter, not a sales reply. Only claims with status "verified" or "subscribed" are returned; addresses are matched case-insensitively against claimed_by_email. Accepts up to 10 comma-separated addresses (invalid ones are silently dropped, extras beyond 10 ignored) because the person replying may be an authorised user writing from another address. An empty claims array means no claim. Callers: roles admin or agent only (API key via X-Api-Key or Authorization: Bearer, or a logged-in browser session; no CSRF check). The router accepts any HTTP method for this URL; the action does not check the method, GET is the intended one.'
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: email
          in: query
          required: true
          description: One or more comma-separated email addresses (max 10 used). At least one valid address is required.
          schema:
            type: string
      responses:
        '200':
          description: Matching claims (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktClaimList'
              example:
                claims:
                  - abn: '11111111111'
                    portal_type: directory
                    tier: free
                    status: verified
                    claimed_by_name: Example Person
                    matched_email: owner@example.invalid
        '401':
          description: No valid session or API key (revoked, expired, unknown key, or owning user inactive).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: Not authenticated
        '403':
          description: Authenticated, but the caller holds none of the roles admin or agent (operator, charter_agent and member are refused).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: Forbidden
        '422':
