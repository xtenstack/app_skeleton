      operationId: mkt_api_unsubscribes_create
      summary: Suppress an email address
      description: 'Records a suppression and fans out to every campaign membership and send history sharing the address. Idempotent: re-suppressing is not an error and still re-runs the membership pass (this repairs visibility); only the status differs, 201 for a new suppression and 200 when already_suppressed. scope "entity" (default; anything other than "address" is treated as entity) means the person asked out: every membership that used the address becomes "unsubscribed" (only from "not contacted" or "sent"; later pipeline states such as replied/won are kept, the event row still records it). scope "address" means the inbox is dead or wrong: sends are marked bounced and memberships are re-opened as "not contacted" when the ABN has another usable unsuppressed email, otherwise set "unsubscribed". Because a reply often comes from a different address than the one mailed, unsubscribe_tokens (footer tokens quoted in the reply, minimum 16 chars after stripping non A-Za-z0-9_- characters, max 10) and related_emails (quoted To: addresses, only counted if we actually sent to them, max 10) are resolved to the originally mailed addresses and suppressed with the same scope; see related in the response. The address is lower-cased on storage. Callers: roles admin or agent only (API key via X-Api-Key or Authorization: Bearer, or a logged-in browser session; no CSRF check). The router accepts any HTTP method for this URL; the action returns 405 unless the method is POST.'
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MktUnsubscribeRequest'
            example:
              email: person@example.invalid
              reason: phone request
              scope: entity
              related_emails:
                - colleague@example.invalid
      responses:
        '200':
          description: Already suppressed (membership pass re-run).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktUnsubscribeResult'
        '201':
          description: Newly suppressed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktUnsubscribeResult'
              example:
                unsubscribe:
                  email: person@example.invalid
                  campaign_code: null
                  reason: phone request
                  unsubscribed_at: '2026-10-01 09:00:00'
                already_suppressed: false
                scope: entity
                memberships: 1
                members_updated: 1
                members_reopened: 0
                sends_bounced: 0
                events_added: 1
                related:
                  colleague@example.invalid: suppressed
        '401':
          description: No valid session or API key (revoked, expired, unknown key, or owning user inactive).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: Not authenticated
        '403':
          description: Authenticated, but the caller holds none of the roles admin or agent (operator, charter_agent and member are refused).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: Forbidden
        '405':
          description: Non-POST request to a write action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: POST required
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: a valid email is required
  /api/leads/health-check:
    post:
      tags:
        - Marketing Public Lead Capture
      operationId: mkt_public_lead_capture_healthCheck
      summary: Public landing-page lead form (Data Restore Audit enquiry)
      description: 'Public, unauthenticated, CORS-enabled endpoint used by the static landing pages on https://deploy.xten.au and https://xten.au. The CORS allow-origin header is only echoed for those two origins, but the origin is not enforced server-side (other callers can still POST). Honeypot: if company_website is non-empty the request is silently dropped and answered with the same {ok:true} 200 (no lead stored), so do not fill it. Required: name, org and a valid email. ABN is resolved best-effort: a supplied abn that has 11 digits, passes the ATO checksum and is an active ABN wins; otherwise a unique match on the email domain (entity_domains) or exact normalised org name against active ABNs; ambiguity or no match leaves the lead unmatched (status "new"; matched leads get status "matched", contacts rows and a domain candidate). A notification email is sent to staff. Not idempotent: each valid POST stores a new lead. Never rejects a submission for a bad abn.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MktPublicLeadRequest'
            example:
              name: Example Person
              org: Example Pty Ltd
              email: person@example.invalid
              phone: '0400000000'
              system: Windows file server
              restored: Never
              abn: '11222333444'
              source: health-check-landing
      responses:
        '200':
          description: Honeypot tripped (lead NOT stored) -- indistinguishable from success by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktOk'
              example:
                ok: true
        '201':
          description: Lead stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktOk'
              example:
                ok: true
        '405':
          description: Non-POST request to a write action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: POST required
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: name, org, and a valid email are required
        '500':
          description: The lead could not be saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: Could not save — please email deploy@xten.au directly
    options:
      tags:
        - Marketing Public Lead Capture
      operationId: mkt_public_lead_capture_healthCheck_preflight
      summary: CORS preflight
      description: Browser CORS preflight. Responds 204 with no body and Access-Control-Allow-Methods POST, OPTIONS; Access-Control-Allow-Origin is set only for https://deploy.xten.au and https://xten.au.
      security: []
      responses:
        '204':
          description: Preflight accepted (no body).
  /marketing/webhook/resend:
    post:
      tags:
        - Marketing Webhooks
      operationId: mkt_webhook_resend
      summary: Resend (Svix) webhook receiver
      description: 'Called only by Resend''s servers; not for API clients. Authenticated by Svix signature instead of an API key: headers svix-id, svix-timestamp (must be within 300 seconds of server time) and svix-signature (space separated "v1,<base64>" values; any match is accepted) where the signature is base64(HMAC-SHA256(secret_bytes, "<svix-id>.<svix-timestamp>.<raw body>")) and secret_bytes is the base64-decoded part of the configured whsec_ secret. Missing or wrong headers, an expired timestamp or an unconfigured secret all return 401. Events are matched to a send by data.email_id = campaign_sends.provider_message_id. email.bounced marks the send bounced; only a Permanent bounce (data.bounce.type) also suppresses the address at ADDRESS scope (Transient bounces never suppress). email.complained records complained_at and always suppresses the address (entity scope). Every other event type, a missing email_id or an unknown message id returns 200 {ok:true} so Resend does not retry. The method is not checked by the action; Resend sends POST.'
      security: []
      parameters:
        - name: svix-id
          in: header
          required: true
          description: Svix message id.
          schema:
            type: string
        - name: svix-timestamp
          in: header
          required: true
          description: Unix seconds; rejected if more than 300 s from server time.
          schema:
            type: string
        - name: svix-signature
          in: header
          required: true
          description: One or more space-separated "v1,<base64 signature>" values.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MktResendWebhookEvent'
            example:
              type: email.bounced
              data:
                email_id: example-message-id
                bounce:
                  type: Permanent
      responses:
        '200':
          description: Accepted (including ignored events).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktOk'
              example:
                ok: true
                note: no matching send
        '400':
          description: Body is not JSON or lacks type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: malformed payload
        '401':
          description: Signature verification failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
              example:
                error: invalid signature
