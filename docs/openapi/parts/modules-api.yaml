  /api/ai-ssa/audit:
    get:
      tags: [AI SSA]
      operationId: aissa_audit_get
      summary: Instance audit records and interactions (live sidecar proxy)
      description: |
        Admin role only. Proxies the instance's sidecar `/api/audit/records` and `/api/interactions` live, no local mirror. With `day` (YYYY-MM-DD, AWST / Australia/Perth calendar day) the lists are filtered to that day and the counts restated. If only one of the two sidecar calls fails its part is returned as an empty array; 502 only when both fail. The inner shapes are the sidecar's and are not fixed here.
      x-unverified: true
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: instance_id
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: day
          in: query
          required: false
          description: Calendar date YYYY-MM-DD, interpreted in Australia/Perth.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', example: "2026-10-27" }
      responses:
        "200":
          description: Audit data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSsaAudit" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSsaError" }
        "403":
          description: Caller is not an admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSsaError" }
        "404":
          description: Instance not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSsaError" }
        "422":
          description: instance_id missing/invalid, or day is not a calendar date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSsaError" }
              example: { error: instance_id is required }
        "502":
          description: Instance has no sidecar credentials, or the sidecar is unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSsaError" }

  /api/ai-ssa/intake/escalations:
    post:
      tags: [AI SSA]
      operationId: aissa_intake_escalations
      summary: Sidecar reports an escalation (HMAC-signed)
      description: |
        Called by the instance's sidecar, not by users. No session, API key or role: each request is authenticated by an HMAC signature. Headers: `X-SSA-Instance: <instance id>` and `X-SSA-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256(intake secret, "<t>.<raw body>")>`. The timestamp must be within 300 seconds. An unknown instance, a decommissioned instance and a bad signature all give the same 401. Body size is checked first: over 16384 bytes gives 413 before authentication.
        Idempotent on `idempotency_key`: a repeat answers 200 with `duplicate:true`; a new escalation answers 201. `notified` is true only when the notification provider confirmed a send.
      security: []
      parameters:
        - name: X-SSA-Instance
          in: header
          required: true
          schema: { type: string, example: "3" }
        - name: X-SSA-Signature
          in: header
          required: true
          schema: { type: string, example: "t=1790000000,v1=<hex hmac>" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiSsaEscalationRequest" }
            example:
              channel: chat
              reason: customer_request
              summary: Visitor asked to speak to a person about invoice 1042.
              idempotency_key: chat-web-20261027-0001
              interaction_ref: sess-8f3a
              occurred_at: "2026-10-27T10:15:00+08:00"
              test_mode: false
      responses:
        "200":
          description: Duplicate of an earlier report (same idempotency_key).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSsaEscalationResult" }
        "201":
          description: Escalation recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSsaEscalationResult" }
        "401":
          description: Not authenticated (bad or missing signature, unknown instance, stale timestamp).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSsaErrors" }
        "413":
          description: Body larger than 16384 bytes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSsaErrors" }
        "422":
          description: Body is not a JSON object, or validation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSsaErrors" }
        "500":
          description: The escalation could not be recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSsaErrors" }

  /api/kpi/entry:
    post:
      tags: [KPI]
      operationId: kpi_entry_upsert
      summary: Upsert a metric actual for a period
      description: |
        Any authenticated principal (session or API key); the code applies no role check and does not consult a metric's `scope_role`. Upserts one actual for the metric and the period of the metric's cadence that starts on `period_start` (exact match required; a period row must already exist). `source` is set to `api` and `entered_by` to null. Body is parsed as JSON whatever the Content-Type. Success is 200 for both create and update. The route has no HTTP method restriction; any non-POST answers 405.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KpiEntryRequest" }
            example: { key: leads_contacted, period_start: "2026-10-26", value: 42, note: Weekly cron push }
      responses:
        "200":
          description: Entry stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KpiEntryResponse" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KpiError" }
        "404":
          description: Unknown or inactive metric key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KpiError" }
              example: { error: Unknown or inactive metric key }
        "405":
          description: Method other than POST.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KpiError" }
              example: { error: POST required }
        "422":
          description: Missing key, period_start or numeric value; period_start not YYYY-MM-DD; or no period of the metric's cadence starts on that date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KpiError" }
              example: { error: "No weekly period starts on 2026-10-27" }

  /api/lice/checkin:
    post:
      tags: [Licensing]
      operationId: lice_checkin
      summary: Validate a licence key for a module (instance check-in)
      description: |
        Public and unauthenticated by design: "authenticated by the key itself". No session, API key or CSRF. No-enumeration rule: a nonexistent key, a revoked/non-active key, a key that does not cover the module, an expired module cover, and missing `key` or `module` all return the identical 403 `{"valid": false}`. A valid check-in updates the key's `last_checkin_at`. The body is parsed as JSON whatever the Content-Type. The route has no HTTP method restriction; any non-POST answers 405 `{error}`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LiceCheckinRequest" }
            example: { key: "<licence key>", module: ai-ssa }
      responses:
        "200":
          description: Key is valid for the module.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiceCheckinValid" }
              example: { valid: true, expires_at: "2027-06-30" }
        "403":
          description: Not valid, for any reason (deliberately indistinguishable).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiceCheckinInvalid" }
              example: { valid: false }
        "405":
          description: Method other than POST.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties: { error: { type: string, example: POST required } }

  /transactions/public-quote/create:
    post:
      tags: [Transactions]
      operationId: txn_public_quote_create
      summary: Public quote request (creates a draft quote)
      description: |
        Public, unauthenticated, for a static page on another origin (the school form on bioldex.xten.au). What stands in for a login:
        - Origin allow-list (Transactions setting `transactions_public_quote_origins`, comma-separated scheme://host[:port], max 20). A request with an Origin not on the list gets 403 `origin_not_allowed` and no CORS headers. An empty list answers no browser origin. A request with no Origin at all (curl, server-side handler) is taken only while `transactions_public_quote_allow_no_origin` is `1`, otherwise 403 `origin_required`.
        - Honeypot: a non-empty `website` field is logged as refused and answered 200 `{"ok": true}` with no reference (a bot learns nothing).
        - Validation (422 with per-field messages), rate limit (429: at most 5 accepted requests per IP and 2 per email address per rolling hour; refused requests do not count), and the instance must have a default internal entity to issue the quote from (503 `not_configured`).
        Every request, accepted or refused, is logged. On success the organisation and contact are found or created in Contacts, a draft quote with one line per item is created (SKUs unknown to the catalogue are added at 0.00 and listed in `unpriced`), and staff (and optionally the requester) are emailed. `reference` is `QR-<draft document id>`; the quote number is allocated when staff post it.
        CORS: when the Origin is allowed, `Access-Control-Allow-Origin` echoes it with `Vary: Origin`, methods POST, OPTIONS, headers Content-Type, Accept, max-age 600. `OPTIONS` always answers 204 (CORS headers only when allowed). Body may be JSON (Content-Type application/json, or a body starting with `{`) or a posted form (`items` may then be a JSON string). Answers use `{ok, error, message, errors?}`. `Cache-Control: no-store`. Router accepts only POST and OPTIONS.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TxnPublicQuoteRequest" }
            example:
              organisation: Example High School
              contact_name: Jane Smith
              email: jane.smith@school.example.test
              phone: "0400 000 000"
              role_title: Science Coordinator
              delivery_suburb: Fremantle
              postcode: "6160"
              po_number: PO-2291
              notes: Delivery before term 1.
              items:
                - { sku: BDX-1001, qty: 10 }
                - { sku: BDX-2002, qty: 2 }
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/TxnPublicQuoteRequest" }
      responses:
        "200":
          description: Honeypot field was filled; request silently discarded.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: { ok: { type: boolean, example: true } }
        "201":
          description: Draft quote created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TxnPublicQuoteAccepted" }
        "204":
          description: CORS preflight (OPTIONS) answer; empty body.
        "403":
          description: Origin not allowed (`origin_not_allowed`) or no Origin and no-origin requests are disabled (`origin_required`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TxnPublicQuoteFailure" }
              example: { ok: false, error: origin_not_allowed, message: Quote requests are not taken from this site. }
        "422":
          description: Validation failed; `errors` maps field (or `items.<n>.sku` / `items.<n>.qty`) to a message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TxnPublicQuoteFailure" }
              example:
                ok: false
                error: validation
                message: Please check the highlighted fields.
                errors: { email: Not an email address, items: Add at least one item }
        "429":
          description: Rate limited; `errors.limit` says which limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TxnPublicQuoteFailure" }
              example:
                ok: false
                error: rate_limited
                message: Too many quote requests in the last hour. Please try again later, or email us.
                errors: { limit: "ip: more than 5 accepted requests in the last hour" }
        "500":
          description: The request could not be recorded (`failed`); nothing was saved except Contacts records.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TxnPublicQuoteFailure" }
        "503":
          description: No default internal entity configured (`not_configured`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TxnPublicQuoteFailure" }

  /store/quote/submit:
    post:
      tags: [Store]
      operationId: store_quote_submit
      summary: Public storefront quote submission (bridges into Transactions)
      description: |
        Public, unauthenticated. Hands a cleaned request to Transactions' QuoteRequest (same validation, rate limit, draft quote creation and notifications as /transactions/public-quote/create) when that module is installed. Differences from the Transactions endpoint:
        - The Origin allow-list only controls whether CORS headers are sent. A disallowed or absent Origin is NOT refused on POST (no 403), and the `transactions_public_quote_allow_no_origin` setting is not consulted.
        - Preflight `OPTIONS` answers 204 for an allowed or absent Origin, 403 (empty body, no CORS headers) for a disallowed Origin.
        - Field aliases accepted: `name` or `contact_name`; `organization` or `organisation` (falls back to the contact name, then "Direct Customer"); `suburb` for delivery suburb; item `quantity` as well as `qty` (a missing or non-positive qty becomes 1). Items with an empty sku are dropped. `po_number` and `role_title` are not forwarded. A non-empty `website` honeypot answers 200 `{"ok": true}`.
        - A QuoteRequestFailed is mapped to 503 only when its `error` is `no_default_issuer` (a key the Transactions module never emits), so every real failure (`not_configured` 503, `failed` 500) is answered 422 here.
        - Any other unexpected exception during the bridged intake (for example a database fault) falls through to a standalone fallback that validates email, name and items and answers 201 with a generated `BDX-QR-xxxxxxxx` reference WITHOUT saving anything. The same fallback is used when Transactions is not installed.
        Router accepts only POST and OPTIONS.
      x-unverified: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreQuoteRequest" }
            example:
              name: Jane Smith
              email: jane.smith@school.example.test
              organization: Example High School
              phone: "0400 000 000"
              suburb: Fremantle
              postcode: "6160"
              notes: Delivery before term 1.
              items:
                - { sku: BDX-1001, qty: 10 }
      responses:
        "200":
          description: Honeypot field filled; discarded.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: { ok: { type: boolean, example: true } }
        "201":
          description: Quote request accepted (Transactions draft, or the non-persisting fallback).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreQuoteAccepted" }
        "204":
          description: CORS preflight (OPTIONS) for an allowed or absent Origin; empty body.
        "403":
          description: CORS preflight (OPTIONS) from a disallowed Origin; empty body.
        "422":
          description: Validation failed (`errors` field map), a mapped QuoteRequestFailed, or a fallback error (`invalid_email`, `missing_name`, `empty_basket`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreQuoteFailure" }
              example:
                ok: false
                error: validation
                message: Please check the highlighted fields.
                errors: { items: Add at least one item }
        "429":
          description: Rate limited (5 accepted per IP, 2 per email, per hour).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreQuoteFailure" }
              example: { ok: false, error: rate_limited, message: "Too many requests; please try again shortly." }
        "503":
          description: Only if the error key is `no_default_issuer`; not reachable with the current Transactions module (see description).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreQuoteFailure" }

  /store/search:
    get:
      tags: [Store]
      operationId: store_search
      summary: Instant product search
      description: |
        Public, unauthenticated. The store is resolved from the HTTP host (domain match), else the active store coded `bioldex`, else the first active store. Returns JSON when the request is an XHR or its `Accept` header contains `application/json`; otherwise it renders the HTML search page. At most 30 published products, ordered by name; matches name, sku, description, mpn or legacy keyword with LIKE. An empty `q` returns an empty list. Any lookup error is swallowed and returns an empty list.
      security: []
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: Accept
          in: header
          required: false
          description: Send `application/json` (or X-Requested-With XMLHttpRequest) to get JSON.
          schema: { type: string, example: application/json }
      responses:
        "200":
          description: JSON results, or the HTML search page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreSearchResponse" }
            text/html:
              schema: { type: string }

  /lin/api/drafts:
    get:
      tags: [Lin]
      operationId: lin_drafts_list
      summary: List the caller's own LinkedIn drafts with review outcome
      description: |
        Roles `agent` and `admin` only (admin for testing); every other role gets 403. Returns only posts created by the calling user, newest first, `limit` default 50 clamped to 1-200. Each draft includes `review`: edit diffs, rejections, approvals, publication events. No LinkedIn token is ever returned. The route registers no method restriction (the action does not check the verb).
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: The caller's drafts.
          content:
            application/json:
              schema:
                type: object
                required: [drafts]
                properties:
                  drafts:
                    type: array
                    items: { $ref: "#/components/schemas/LinDraftWithReview" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }
        "403":
          description: Role is not agent or admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }

  /lin/api/drafts/create:
    post:
      tags: [Lin]
      operationId: lin_drafts_create
      summary: Create a LinkedIn draft
      description: |
        Roles `agent` and `admin` only. Creates a draft on an active target; `ai_generated` is forced on, the AI disclosure text defaults from settings, and `locked_text` cannot be set via the API. With `submit:true` the draft moves straight to `in_review`. There is deliberately no API route that approves, schedules, exports or publishes. The body is parsed as JSON whatever the Content-Type. Non-POST answers 405. Business-rule refusals are 422 with a message.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinDraftCreateRequest" }
            example:
              target_id: 1
              body: "New: our small-business support plans start at the published price. Details on our website."
              hashtags: "#smallbusiness #support"
              source_ref: REQ-203
              submit: true
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema:
                type: object
                required: [draft]
                properties:
                  draft: { $ref: "#/components/schemas/LinDraft" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }
        "403":
          description: Role is not agent or admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }
        "405":
          description: Method other than POST.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }
        "422":
          description: Unknown or inactive target, empty body text, or a save/transition refusal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }
              example: { error: Post text is required }

  /lin/api/drafts/update/{id}:
    post:
      tags: [Lin]
      operationId: lin_drafts_update
      summary: Edit the caller's own draft
      description: |
        Roles `agent` and `admin` only, and only on posts the caller created (otherwise 404). Editable fields: body, hashtags, first_comment, source_ref, target_id (other keys are ignored). The post must be draft, in_review or rejected for the agent role; editing an in_review post may clear approval. 422 for locked text, empty body, target change on a non-draft, unknown target, or a post status the role cannot edit. Non-POST answers 405.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 0 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinDraftUpdateRequest" }
            example: { body: Revised post text after review feedback. }
      responses:
        "200":
          description: Draft updated.
          content:
            application/json:
              schema:
                type: object
                required: [draft]
                properties:
                  draft: { $ref: "#/components/schemas/LinDraft" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }
        "403":
          description: Role is not agent or admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }
        "404":
          description: No such post, or not created by the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }
              example: { error: Not found }
        "405":
          description: Method other than POST.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }
        "422":
          description: Business-rule refusal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }

  /lin/api/drafts/submit/{id}:
    post:
      tags: [Lin]
      operationId: lin_drafts_submit
      summary: Submit the caller's own draft for review
      description: Roles `agent` and `admin` only, own posts only (404 otherwise). Moves draft or rejected to in_review; any other source status gives 422. No body. Non-POST answers 405.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Submitted; draft returned.
          content:
            application/json:
              schema:
                type: object
                required: [draft]
                properties:
                  draft: { $ref: "#/components/schemas/LinDraft" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }
        "403":
          description: Role is not agent or admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }
        "404":
          description: No such post, or not created by the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }
        "405":
          description: Method other than POST.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }
        "422":
          description: The post is not in a state that can be submitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }

  /lin/api/drafts/media/{id}:
    post:
      tags: [Lin]
      operationId: lin_drafts_media
      summary: Attach a media file to the caller's own draft
      description: |
        Roles `agent` and `admin` only, own posts only (404 otherwise). Multipart upload; the first uploaded file is used. Allowed types (detected from content, not the filename): JPEG, PNG, GIF (image, max 36 MB), MP4 (video, max 500 MB), PDF, DOC, DOCX, PPT, PPTX (document, max 100 MB). 422 when the post cannot be edited, no file is sent, the type is unsupported, the file is too large or storage is not writable. Adding media to an approved post clears its approval (same as a text edit). Non-POST answers 405.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 0 } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                title: { type: string }
                alt_text: { type: string }
                ai_presenter: { type: boolean, description: "Truthy marks the media as showing an AI presenter." }
      responses:
        "201":
          description: Media stored; draft returned.
          content:
            application/json:
              schema:
                type: object
                required: [draft]
                properties:
                  draft: { $ref: "#/components/schemas/LinDraft" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }
        "403":
          description: Role is not agent or admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }
        "404":
          description: No such post, or not created by the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }
        "405":
          description: Method other than POST.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }
        "422":
          description: Cannot edit, no file, unsupported type, too large, or storage failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinError" }
              example: { error: 'Send the file as multipart field "file" (server limit 64M)' }

  /lin/api/context:
