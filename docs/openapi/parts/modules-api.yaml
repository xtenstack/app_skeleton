      tags: [Lin]
      operationId: lin_context_get
      summary: Read-only grounding context for drafting
      description: Roles `agent` and `admin` only. House rules, published prices, main phone, link-domain allowlist, locked texts, grounding text, the 15 most recently posted bodies (200 characters each) and the active targets. The route registers no method restriction (the action does not check the verb).
      security:
