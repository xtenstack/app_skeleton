  /maama/api/agents:
    get:
      tags: [MAAMA]
      operationId: maama_agents_list
      summary: List active agent role profiles
      description: 'Roles admin, operator or agent (the role gate in ApiControllerBase; members and charter agents get 403). Active profiles ordered by role name; profiles whose user row is missing are skipped. Read only; creating or editing a profile is admin-only in the backend UI. A session caller sending any POST must use `Content-Type: application/json` (415); not relevant to this GET. Routed by the module''s `/maama/api/:controller` route (any method accepted).'
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Agents.
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/MaamaAgent" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "403":
