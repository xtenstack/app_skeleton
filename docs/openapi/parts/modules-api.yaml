          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }

  /maama/api/handovers:
    get:
      tags: [MAAMA]
      operationId: maama_handovers_list
      summary: List handovers
      description: |
        Roles admin, operator, agent. Newest id first, no pagination, no updates trail (use the single GET). Filters combine with AND. Invalid filter values are 422. `target`/`owner` accept a user id or `me` (the caller). `since` filters on `updated_at`, so notes and status changes also surface. The same handler answers `/maama/api/handovers/index`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/MaamaStatus" }
        - name: priority
          in: query
          required: false
          schema: { $ref: "#/components/schemas/MaamaPriority" }
        - name: target
          in: query
          required: false
          description: User id or `me`.
          schema: { type: string, example: me }
        - name: owner
          in: query
          required: false
          description: User id or `me`.
          schema: { type: string, example: "12" }
        - name: target_mode
          in: query
          required: false
          description: "`once`, `ongoing`, or `any` (every local-agent handover)."
          schema: { type: string, enum: [once, ongoing, any] }
        - name: since
          in: query
          required: false
          description: Date or date-time (strtotime-parsable).
          schema: { type: string, example: "2026-10-27" }
      responses:
        "200":
          description: Handovers.
          content:
            application/json:
              schema:
                type: object
                required: [handovers]
                properties:
                  handovers:
                    type: array
                    items: { $ref: "#/components/schemas/MaamaHandover" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "403":
          description: Role not allowed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "422":
          description: Invalid filter value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
              example: { error: invalid status }

  /maama/api/handovers/view/{id}:
    get:
      tags: [MAAMA]
      operationId: maama_handovers_get
      summary: Get one handover with its update trail
      description: Roles admin, operator, agent. `id` is the numeric id (not the display id). 404 for a non-numeric or unknown id.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: The handover with `updates`.
          content:
            application/json:
              schema:
                type: object
                required: [handover]
                properties:
                  handover: { $ref: "#/components/schemas/MaamaHandoverDetail" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "403":
          description: Role not allowed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "404":
          description: Not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }

  /maama/api/handovers/create:
    post:
      tags: [MAAMA]
      operationId: maama_handovers_create
      summary: Create a handover
      description: |
        Roles admin, operator, agent. `subject` and `target_user_id` are required; the source is always the authenticated caller. Defaults: status `open`, priority `normal`, type `handover`. A session caller must send `Content-Type: application/json` on any POST (415). Non-POST answers 405. Database column limits: subject 200, type 50, source_session 100.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaamaHandoverCreateRequest" }
            example:
              subject: Review the Forum plugin PR
              target_user_id: 7
              priority: high
              source_session: code-2026-10-28
              context: Branch forum-events is ready.
              content: Please check idempotency handling.
              related: "plugins#20"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [handover]
                properties:
                  handover: { $ref: "#/components/schemas/MaamaHandoverDetail" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "403":
          description: Role not allowed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "405":
          description: Method other than POST.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "415":
          description: Session caller sent a non-JSON Content-Type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "422":
          description: Missing subject, unknown target/owner user, invalid priority, or a save failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
              example: { error: subject is required }

  /maama/api/handovers/update/{id}:
    post:
      tags: [MAAMA]
      operationId: maama_handovers_update
      summary: Update a handover (any subset of fields) and record a trail entry
      description: |
        Roles admin, operator, agent. Any subset of subject, type, priority, status, owner_user_id (null clears), target_user_id, source_session, context, content, related, est_time, target_mode, status_note, register_note, plus an optional `note` recorded on the trail and an optional `expect_status` precondition (409 when the status is already different). A text field sent as null or blank is stored as null. A trail entry is written when a note is given or the status changes. Source user is not changeable. 415 for a session caller without a JSON Content-Type; 405 for non-POST.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 0 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaamaHandoverUpdateRequest" }
            example: { status: in_progress, owner_user_id: 7, note: Picked this up. }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [handover]
                properties:
                  handover: { $ref: "#/components/schemas/MaamaHandoverDetail" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "403":
          description: Role not allowed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "404":
          description: Not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "405":
          description: Method other than POST.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "415":
          description: Session caller sent a non-JSON Content-Type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "409":
          description: "`expect_status` given and the handover's status is different."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "422":
          description: Invalid field, empty subject, unknown user, or save failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }

  /maama/api/handovers/claim/{id}:
    post:
      tags: [MAAMA]
      operationId: maama_handovers_claim
      summary: Claim a handover (compare-and-set Open to In progress)
      description: |
        Roles admin, operator, agent. In one statement, sets status `in_progress` and the caller as owner only if the status is still `open` (or the optional `expect_status`), and appends a trail entry. 409 when someone else already changed the status, so two runners or a restart never take the same job. Optional body `{note, expect_status}`. 415 for a session caller without a JSON Content-Type; 405 for non-POST.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 0 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
                expect_status: { $ref: "#/components/schemas/MaamaStatus" }
            example: { note: Claimed by jan-runner. }
      responses:
        "200":
          description: Claimed.
          content:
            application/json:
              schema:
                type: object
                required: [handover]
                properties:
                  handover: { $ref: "#/components/schemas/MaamaHandoverDetail" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "403":
          description: Role not allowed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "404":
          description: Not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "405":
          description: Method other than POST.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "409":
          description: Not claimed; the status is no longer the expected one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "422":
          description: Invalid `expect_status`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }

  /maama/api/handovers/note/{id}:
    post:
      tags: [MAAMA]
      operationId: maama_handovers_note
      summary: Append a note (optionally changing status) to a handover
      description: Roles admin, operator, agent. `note` is required and non-blank; `status` optional (blank ignored). Answers 201 with the full handover. 415 for a session caller without a JSON Content-Type; 405 for non-POST.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 0 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaamaNoteRequest" }
            example: { note: Reviewed and merged., status: done }
      responses:
        "201":
          description: Trail entry appended.
          content:
            application/json:
              schema:
                type: object
                required: [handover]
                properties:
                  handover: { $ref: "#/components/schemas/MaamaHandoverDetail" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "403":
          description: Role not allowed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "404":
          description: Not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "405":
          description: Method other than POST.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "415":
          description: Session caller sent a non-JSON Content-Type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }
        "422":
          description: Missing note, invalid status, or save failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaamaError" }

  /requirements/api/index:
    get:
      tags: [Requirements]
      operationId: req_list
      summary: List requirements
      description: |
        Roles admin and operator only (agents get 403). Reached through the module's generic route `/requirements/:controller/:action/:params` with controller `api`; `/requirements/api` (no action) is the same handler. Newest id first, no pagination. Invalid `status`, `type` or `priority` filter values are silently ignored (not 422). `q` is a LIKE substring on title, description or display_id.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ReqStatus" }
        - name: type
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ReqType" }
        - name: priority
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ReqPriority" }
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Requirements.
          content:
            application/json:
              schema:
                type: object
                required: [requirements]
                properties:
                  requirements:
                    type: array
                    items: { $ref: "#/components/schemas/ReqRequirement" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReqError" }
        "403":
          description: Role not admin or operator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReqError" }

  /requirements/api/view/{id}:
    get:
      tags: [Requirements]
      operationId: req_get
      summary: Get one requirement
      description: Roles admin and operator only. `id` is the numeric id (not REQ-nnn). A URL without the id is answered by the framework's not-found page, not this controller.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: The requirement.
          content:
            application/json:
              schema:
                type: object
                required: [requirement]
                properties:
                  requirement: { $ref: "#/components/schemas/ReqRequirement" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReqError" }
        "403":
          description: Role not admin or operator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReqError" }
        "404":
          description: Not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReqError" }

  /requirements/api/create:
    post:
      tags: [Requirements]
      operationId: req_create
      summary: Create a requirement
      description: |
        Roles admin and operator only. `title` is required (422 if blank). Invalid `type` falls back to `user`, invalid `priority` to `normal`, and an invalid status or `complete` falls back to `open` (silently, not an error); create `complete` via update with a changelog decision. `display_id` is generated as REQ-nnn (next highest). Non-POST answers 405. The body is parsed as JSON whatever the Content-Type.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReqCreateRequest" }
            example:
              title: Add OpenAPI docs for module APIs
              description: Document the smaller module endpoints.
              type: internal
              priority: normal
              project: xten-stack
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [requirement]
                properties:
                  requirement: { $ref: "#/components/schemas/ReqRequirement" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReqError" }
        "403":
          description: Role not admin or operator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReqError" }
        "405":
          description: Method other than POST.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReqError" }
        "422":
          description: Missing title, or a save failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReqError" }
              example: { error: title is required }

  /requirements/api/update/{id}:
    post:
      tags: [Requirements]
      operationId: req_update
      summary: Update a requirement
      description: |
        Roles admin and operator only. Partial update of title, description, origin_session, project, branch, target_version, notes, changelog_note (null clears), type, priority and status. Invalid type, priority or status is 422 here (unlike create). Setting `status: complete` needs `changelog_decision` of `included` or `excluded_deliberately` (forced to `included` when the requirement is already linked to a changelog); any status other than complete clears `changelog_decision` and `changelog_id`. Delete and bulk actions are not exposed. Non-POST answers 405.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 0 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReqUpdateRequest" }
            example: { status: complete, changelog_decision: included, changelog_note: Shipped in 1.4.0 }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [requirement]
                properties:
                  requirement: { $ref: "#/components/schemas/ReqRequirement" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReqError" }
        "403":
          description: Role not admin or operator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReqError" }
        "404":
          description: Not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReqError" }
        "405":
          description: Method other than POST.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReqError" }
        "422":
          description: Invalid type/priority/status, complete without a valid changelog_decision, or a save failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReqError" }
              example: { error: "status 'complete' requires a valid changelog_decision" }

components:
  schemas:
    # ---------------------------------------------------------------- Announcements
    AnnError:
      type: object
      required: [error]
      properties:
        error: { type: string, example: Not authenticated }
    AnnValidationError:
      type: object
      required: [error]
      properties:
        error: { type: string, example: Validation failed }
        errors:
          type: object
          description: Field name to message. Absent when a model save failed (then `error` carries the messages).
          additionalProperties: { type: string }
    AnnAnnouncement:
      type: object
      required: [id, title, body, audience, severity]
      properties:
        id: { type: integer, example: 12 }
        title: { type: string, maxLength: 200, example: Planned maintenance window }
        body: { type: string, example: Stack will be briefly unavailable on Sunday. }
        author_user_id: { type: integer, nullable: true, example: 1 }
        audience: { type: string, enum: [everyone, all, staff] }
        severity: { type: string, enum: [info, notice, important] }
        published_at: { type: string, nullable: true, description: "Database timestamp, null for a draft.", example: "2026-10-28 09:00:00" }
        expires_at: { type: string, nullable: true, example: "2026-11-01 23:59:59" }
        source: { type: string, nullable: true, example: onedrive-inbox }
        external_id: { type: string, nullable: true, example: maintenance-2026-11-01 }
        source_url: { type: string, nullable: true, example: "https://example.test/inbox/maintenance.md" }
        created_at: { type: string, example: "2026-10-28 08:55:00" }
        updated_at: { type: string, example: "2026-10-28 08:55:00" }
    AnnCreateRequest:
      type: object
      required: [title, body]
      properties:
        title: { type: string, maxLength: 200, description: 'Trimmed, non-empty.' }
        body: { type: string, description: 'Trimmed, non-empty.' }
        severity:
          type: string
          default: info
          description: "Case-insensitive. Aliases warning -> notice, critical -> important."
          enum: [info, notice, important, warning, critical]
        audience:
          type: string
          default: all
          description: "Case-insensitive. Aliases: staff-only, staff_only (staff); staff-and-agents, all-staff-and-agents (all); public, customers (everyone). On an existing row the audience changes only when this key is present."
          enum: [everyone, all, staff, staff-only, staff_only, staff-and-agents, all-staff-and-agents, public, customers]
        publish:
          type: boolean
          default: false
          description: "Also accepts 0/1 and boolean-like strings (true/false/yes/no/on/off/1/0)."
        expires_at:
          type: string
          nullable: true
          description: "Y-m-d (stored as end of that day, 23:59:59) or Y-m-d H:i:s, strict. Omitted or null means no expiry."
          example: "2026-11-01"
        source:
          type: string
          maxLength: 40
          description: 'Required when external_id is given. Letters, digits and `: . _ -`, starting with a letter or digit.'
          pattern: '^[A-Za-z0-9][A-Za-z0-9:._-]*$'
        external_id: { type: string, maxLength: 160, description: 'Idempotency key within `source`.' }
        source_url: { type: string, maxLength: 2000, description: "http(s) URL.", pattern: '^https?://\S+$' }
    AnnWriteResult:
      type: object
      required: [announcement, created]
      properties:
        announcement: { $ref: "#/components/schemas/AnnAnnouncement" }
        created: { type: boolean, description: "true on 201, false when an existing source+external_id row was updated (200)." }
    # ---------------------------------------------------------------- Forum
    ForumError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    ForumInvalidEvent:
      type: object
      required: [error, errors]
      properties:
        error: { type: string, example: Invalid event }
        errors:
          type: object
          description: Field path to message.
          additionalProperties: { type: string }
    ForumAccepted:
      type: object
      required: [accepted, duplicate]
      properties:
        accepted: { type: boolean, example: true }
        duplicate: { type: boolean, description: "true when this event_id was already stored." }
    ForumEnvelope:
      type: object
      required: [event_id, entity_key, sequence, event_type, game_key, universe_id, occurred_at, payload]
      properties:
        event_id:
          type: string
          minLength: 1
          maxLength: 191
          description: Idempotency key; must equal `{game_key}:{event_type}:{entity_key}:{sequence}`.
        entity_key: { type: string, minLength: 1, maxLength: 150 }
        sequence: { type: string, minLength: 1, maxLength: 100, description: Unique per emission; kept on retry. }
        event_type:
          type: string
          minLength: 1
          maxLength: 40
          enum: [user.upsert, alliance.upsert, membership.active, membership.revoked, alliance.archived, tutorial.post.upsert]
        game_key: { type: string, minLength: 1, maxLength: 50, pattern: '^[a-z0-9][a-z0-9-]*$' }
        universe_id: { type: integer, minimum: 0, description: JSON integer (a numeric string is rejected). }
        occurred_at:
          type: string
          description: "ISO 8601 UTC timestamp (any offset accepted and normalised to UTC; up to 9 fractional digits). Regex: date T/space time, optional fraction, optional Z or +hh:mm."
          example: "2026-10-26T12:00:00Z"
        payload:
          description: Object whose single top-level key depends on event_type (user, alliance, membership, tutorial_post).
          oneOf:
            - $ref: "#/components/schemas/ForumPayloadUser"
            - $ref: "#/components/schemas/ForumPayloadAlliance"
            - $ref: "#/components/schemas/ForumPayloadMembership"
            - $ref: "#/components/schemas/ForumPayloadTutorial"
    ForumPayloadUser:
      type: object
      description: payload for `user.upsert`.
      required: [user]
      properties:
        user:
          type: object
          required: [game_user_id, username, email]
          properties:
            game_key: { type: string, description: "Optional; must equal the envelope game_key if present." }
            universe_id: { type: integer, description: "Optional; must equal the envelope universe_id if present." }
            game_user_id: { type: integer, minimum: 1 }
            username: { type: string, minLength: 1, maxLength: 100, description: Non-blank. }
            email: { type: string, format: email, maxLength: 150 }
            language: { type: string, maxLength: 10, nullable: true }
            profile:
              type: object
              nullable: true
              additionalProperties: true
              properties:
                avatar_url: { type: string, nullable: true }
                alliance_tag: { type: string, nullable: true }
                join_date: { type: string, nullable: true }
    ForumPayloadAlliance:
      type: object
      description: payload for `alliance.upsert` and `alliance.archived`. `name` and `tag` are required for upsert only.
      required: [alliance]
      properties:
        alliance:
          type: object
          required: [game_alliance_id]
          properties:
            game_key: { type: string }
            universe_id: { type: integer }
            game_alliance_id: { type: integer, minimum: 1 }
            name: { type: string, minLength: 1, maxLength: 150, description: Required for alliance.upsert. }
            tag: { type: string, minLength: 1, maxLength: 30, description: Required for alliance.upsert. }
            state: { type: string, enum: [active, archived], description: "Optional; must be `active` for alliance.upsert and `archived` for alliance.archived." }
    ForumPayloadMembership:
      type: object
      description: payload for `membership.active` and `membership.revoked`.
      required: [membership]
      properties:
        membership:
          type: object
          required: [game_user_id, game_alliance_id]
          properties:
            game_key: { type: string }
            universe_id: { type: integer }
            game_user_id: { type: integer, minimum: 1 }
            game_alliance_id: { type: integer, minimum: 1 }
            state: { type: string, enum: [active, revoked], description: "Optional; must be `active` for membership.active and `revoked` for membership.revoked." }
    ForumPayloadTutorial:
      type: object
      description: payload for `tutorial.post.upsert`.
      required: [tutorial_post]
      properties:
        tutorial_post:
          type: object
          required: [slug, title, body, author]
          properties:
            game_key: { type: string }
            universe_id: { type: integer }
            area: { type: string, enum: [tutorial] }
            slug: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-z0-9][a-z0-9-]*$' }
            title: { type: string, minLength: 1, maxLength: 200 }
            body: { type: string, description: 'Markdown; a string, may be empty.' }
            format: { type: string, enum: [markdown] }
            state: { type: string, enum: [published, draft] }
            author:
              type: object
              required: [game_user_id]
              properties:
                game_user_id: { type: integer, minimum: 1 }
                username: { type: string, description: Not validated by the envelope. }
    # ---------------------------------------------------------------- Catalogue
    CatError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    CatProductSummary:
      type: object
      properties:
        id: { type: integer, example: 101 }
        name: { type: string, example: Microscope slide set }
        slug: { type: string, example: microscope-slide-set }
        sku: { type: string, example: BDX-1001 }
        description: { type: string, nullable: true }
        product_type: { type: string, nullable: true }
        fulfilment_type: { type: string, nullable: true }
        requires_quote: { type: boolean }
        price_cents: { type: integer, description: "Default variant price in cents; 0 when none or quote-only.", example: 4500 }
        price_formatted: { type: string, description: 'Dollar string, or "Quote Required" when price_cents is 0.', example: "$45.00" }
        stock_level: { type: integer, example: 25 }
    CatProductList:
      type: object
      required: [count, limit, offset, products]
      properties:
        count: { type: integer, description: Number of products in this page. }
        limit: { type: integer }
        offset: { type: integer }
        products:
          type: array
          items: { $ref: "#/components/schemas/CatProductSummary" }
    CatProductDetail:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        sku: { type: string }
        description: { type: string, nullable: true }
        product_type: { type: string, nullable: true }
        fulfilment_type: { type: string, nullable: true }
        requires_quote: { type: boolean }
        price_cents: { type: integer }
        price_formatted: { type: string }
        images:
          type: array
          items:
            type: object
            properties:
              path: { type: string, example: products/bdx-1001.jpg }
              is_primary: { type: boolean }
              alt_text: { type: string, nullable: true }
    CatQuoteRequest:
      type: object
      required: [name, email, sku]
      properties:
        name: { type: string, description: 'Trimmed, non-empty.' }
        email: { type: string, description: 'Trimmed, non-empty; not format-validated.' }
        sku: { type: string, description: 'Trimmed, non-empty; not checked against the catalogue.' }
        phone: { type: string }
        company: { type: string }
        notes: { type: string }
    CatQuoteAccepted:
      type: object
      required: [status, message, ticket_id]
      properties:
        status: { type: string, enum: [success] }
        message: { type: string }
        ticket_id: { type: integer, nullable: true, description: Null when the Tickets model is not available. }
    CatQuoteFailed:
      type: object
      required: [status, error]
      properties:
        status: { type: string, enum: [error] }
        error: { type: string }
    # ---------------------------------------------------------------- AI SSA Chat
    ChatError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    ChatErrors:
      type: object
      required: [error, errors]
      properties:
        error: { type: string, description: First message. }
        errors:
          type: array
          items: { type: string }
    ChatStartRequest:
      type: object
      required: [embed_token]
      properties:
        embed_token: { type: string, pattern: '^[a-f0-9]{48}$', description: The widget's embed token (48 lowercase hex characters). }
    ChatStartResponse:
      type: object
      required: [session_id, greeting, title, test_mode]
      properties:
        session_id: { type: string, pattern: '^web:[a-f0-9]{32}\.[a-f0-9]{32}$' }
        greeting: { type: string }
        title: { type: string }
        test_mode: { type: boolean, description: True unless the instance's fulfilment mode is live. }
    ChatMessageRequest:
      type: object
      required: [embed_token, session_id, message]
      properties:
        embed_token: { type: string, pattern: '^[a-f0-9]{48}$' }
        session_id: { type: string, description: "As issued by start; must match ^[A-Za-z0-9._:-]{8,100}$ and the HMAC check." }
        message: { type: string, maxLength: 2000, description: 'Trimmed, non-empty.' }
        page_url: { type: string, maxLength: 500, description: Optional page the visitor is on; trimmed and truncated to 500. }
    ChatMessageResponse:
      type: object
      required: [session_id, reply, escalated, closed, test_mode]
      properties:
        session_id: { type: string }
        reply: { type: string }
        escalated: { type: boolean }
        closed: { type: boolean }
        test_mode: { type: boolean }
    ChatChannelState:
      type: object
      description: Licence-gate state of a channel for an instance (AI SSA core ChannelState).
      properties:
        module_key: { type: string, example: ai-ssa-chat }
        state:
          type: string
          enum: [ready, installed_not_licensed, core_not_licensed, installed_disabled, instance_not_active, licensed_not_installed, not_installed, instance_not_found]
        label: { type: string }
        detail: { type: string }
        installed: { type: boolean }
        enabled: { type: boolean }
        licensed: { type: boolean }
        usable: { type: boolean }
    ChatWidgetConfig:
      type: object
      nullable: true
      properties:
        id: { type: integer }
        instance_id: { type: integer, nullable: true }
        enabled: { type: boolean }
        embed_token: { type: string, example: "0123456789abcdef0123456789abcdef0123456789abcdef" }
        greeting_override: { type: string, nullable: true }
        widget_title: { type: string, nullable: true }
        allowed_origins: { type: array, items: { type: string }, description: Empty means any origin. }
        rate_limit_per_minute: { type: integer }
        token_rotated_at: { type: string, nullable: true }
        config_pushed_at: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }
    ChatConfigResponse:
      type: object
      required: [instance_id, channel, config]
      properties:
        instance_id: { type: integer }
        channel: { $ref: "#/components/schemas/ChatChannelState" }
        config: { $ref: "#/components/schemas/ChatWidgetConfig" }
    ChatConfigSaved:
      type: object
      required: [instance_id, channel, config, pushed]
      properties:
        instance_id: { type: integer }
        channel: { $ref: "#/components/schemas/ChatChannelState" }
        config: { $ref: "#/components/schemas/ChatWidgetConfig" }
        pushed: { type: boolean, nullable: true, description: "null: no push was due; true: pushed and acknowledged; false: push failed (row saved anyway)." }
    ChatConfigRequest:
      type: object
      description: All fields optional on update; a create (no widget yet) needs none beyond what the path supplies.
      properties:
        greeting_override: { type: string, maxLength: 300, nullable: true, description: Blank or null clears it. }
        widget_title: { type: string, maxLength: 60, nullable: true, description: 'One line, no `<` or `>`. Blank or null clears it.' }
        allowed_origins:
          description: List of origins, or a string separated by newlines, commas or semicolons. Scheme and host with optional port only, lower-cased, de-duplicated, at most 20. Empty list means any origin.
          oneOf:
            - type: array
              items: { type: string, example: "https://www.client.example" }
              maxItems: 20
            - type: string
        rate_limit_per_minute: { type: integer, minimum: 1, maximum: 600, default: 120 }
        enabled: { type: boolean }
        rotate_token: { type: boolean, description: "Exactly true replaces the embed token." }
        instance_id: { type: integer, description: 'Ignored on create, rejected (422) on update.' }
    # ---------------------------------------------------------------- AI SSA Email
    EmailError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    EmailErrors:
      type: object
      required: [error, errors]
      properties:
        error: { type: string }
        errors: { type: array, items: { type: string } }
    EmailMailbox:
      type: object
      properties:
        id: { type: integer }
        instance_id: { type: integer, nullable: true }
        mailbox_address: { type: string, format: email }
        imap_host: { type: string }
        imap_port: { type: integer, example: 993 }
        imap_user: { type: string }
        imap_password_set: { type: boolean }
        smtp_host: { type: string, nullable: true }
        smtp_port: { type: integer, example: 587 }
        smtp_user: { type: string, nullable: true }
        processed_folder: { type: string, example: INBOX.Processed }
        baseline_done: { type: boolean }
        baseline_done_at: { type: string, nullable: true }
        credential_pushed: { type: boolean }
        config_pushed_at: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }
    EmailConfigResponse:
      type: object
      required: [instance_id, channel, mailboxes, push_due, push_owed]
      properties:
        instance_id: { type: integer }
        channel: { $ref: "#/components/schemas/ChatChannelState" }
        mailboxes:
          type: array
          items: { $ref: "#/components/schemas/EmailMailbox" }
        push_due: { type: boolean }
        push_owed: { type: boolean }
    EmailMailboxRequest:
      type: object
      properties:
        mailbox_address: { type: string, maxLength: 255, format: email, description: "Required on create; lower-cased; identifies the mailbox for updates." }
        imap_host: { type: string, maxLength: 253, description: "Required on create. Host name (at least one dot) or IP; no scheme, port or path." }
        imap_port: { type: integer, minimum: 1, maximum: 65535, default: 993 }
        imap_user: { type: string, maxLength: 255, description: Required on create. }
        imap_password: { type: string, maxLength: 500, description: Write-only; required on create; blank on update keeps the stored one. }
        smtp_host: { type: string, maxLength: 253, nullable: true, description: Blank or null clears it. }
        smtp_port: { type: integer, minimum: 1, maximum: 65535, default: 587 }
        smtp_user: { type: string, maxLength: 255, nullable: true }
        processed_folder:
          type: string
          maxLength: 120
          default: INBOX.Processed
          description: Letters, numbers and `. _ / -` (and spaces inside), starting with a letter or number.
        instance_id: { type: integer, description: 'Ignored on create (the path wins), rejected (422) on update of an existing mailbox.' }
    # ---------------------------------------------------------------- AI SSA Phone
    PhoneError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    PhoneErrors:
      type: object
      required: [error, errors]
      properties:
        error: { type: string }
        errors: { type: array, items: { type: string } }
    PhoneLine:
      type: object
      nullable: true
      properties:
        id: { type: integer }
        instance_id: { type: integer, nullable: true }
        did_number: { type: string, example: "+6189000000" }
        sip_trunk_ref: { type: string, nullable: true }
        escalation_number: { type: string, example: "0400000000" }
        config_pushed_at: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }
    PhoneConfigResponse:
      type: object
      required: [instance_id, channel, config, retention, push_due, push_owed]
      properties:
        instance_id: { type: integer }
        channel: { $ref: "#/components/schemas/ChatChannelState" }
        config: { $ref: "#/components/schemas/PhoneLine" }
        retention:
          type: object
          properties:
            days: { type: integer, enum: [0, 7, 30, 90, 365] }
            summary: { type: string }
            editable_here: { type: boolean, description: Always false; set on the instance in the AI SSA core. }
        push_due: { type: boolean }
        push_owed: { type: boolean }
    PhoneConfigRequest:
      type: object
      properties:
        did_number: { type: string, description: "Required on create. Optional +, then 6 to 15 digits; spaces, dashes, dots, brackets stripped." }
        escalation_number: { type: string, description: "Required on create. Same format as did_number." }
        sip_trunk_ref: { type: string, maxLength: 120, nullable: true, description: 'One line, no `<` `>`; blank clears it.' }
        instance_id: { type: integer, description: 'Ignored on create, rejected (422) on update.' }
    # ---------------------------------------------------------------- AI SSA core
    AiSsaError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    AiSsaErrors:
      type: object
      required: [error, errors]
      properties:
        error: { type: string, description: First message. }
        errors: { type: array, items: { type: string } }
    AiSsaInstance:
      type: object
      properties:
        id: { type: integer, example: 3 }
        client_name: { type: string }
        sidecar_base_url: { type: string, example: "http://ssa-agent:8000" }
        sidecar_auth_user: { type: string, nullable: true }
        sidecar_auth_pass_set: { type: boolean }
        provisioning_status: { type: string, enum: [pending, active, suspended, decommissioned] }
        licence_status: { type: string, description: 'Summary derived from the core licence (exact vocabulary defined by LicenceGate::instanceSummary, not enumerated here).' }
        fulfilment_mode: { type: string }
        effective_fulfilment_mode: { type: string }
        live_confirmed_at: { type: string, nullable: true }
        last_health_status: { type: string, nullable: true }
        last_health_message: { type: string, nullable: true }
        last_health_checked_at: { type: string, nullable: true }
        config_synced_at: { type: string, nullable: true }
        assistant_name: { type: string, nullable: true }
        assistant_title: { type: string, nullable: true }
        organisation_name: { type: string, nullable: true }
        assistant_introduction: { type: string }
        recording_retention_days: { type: integer, enum: [0, 7, 30, 90, 365] }
        fulfilment_adapter: { type: string, enum: [none, webhook] }
        fulfilment_endpoint_url: { type: string, nullable: true }
        fulfilment_secret_set: { type: boolean }
        callback_base_url: { type: string, nullable: true }
        escalation_email_recipients: { type: array, items: { type: string } }
        created_at: { type: string }
        updated_at: { type: string }
    AiSsaInstanceDetail:
      allOf:
        - $ref: "#/components/schemas/AiSsaInstance"
        - type: object
          properties:
            channels:
              type: object
              description: Channel module key to licence-gate state.
              additionalProperties: { $ref: "#/components/schemas/ChatChannelState" }
    AiSsaInstanceRequest:
      type: object
      description: On create `client_name`, `sidecar_base_url`, `sidecar_auth_user` and `sidecar_auth_pass` are required; on update every field is optional.
      properties:
        client_name: { type: string, maxLength: 200 }
        sidecar_base_url: { type: string, maxLength: 255, description: "http(s) URL with a host; no credentials, query or fragment; trailing slash trimmed." }
        sidecar_auth_user: { type: string, maxLength: 100, description: No colon. }
        sidecar_auth_pass: { type: string, description: Write-only; required on create; blank on update keeps the stored one. }
        provisioning_status: { type: string, enum: [pending, active, suspended, decommissioned], default: pending }
        assistant_name: { type: string, nullable: true, minLength: 2, maxLength: 30, description: "Letters, spaces, hyphens, apostrophes, full stops; starts with a letter. Blank clears." }
        assistant_title: { type: string, nullable: true, maxLength: 60, description: "Letters, numbers, spaces and & , . / ( ) - '; starts with a letter or number. Blank clears." }
        organisation_name: { type: string, nullable: true, maxLength: 120, description: "Starts with a letter or number; no `<`, `>` or control characters. Blank clears." }
        recording_retention_days: { type: integer, enum: [0, 7, 30, 90, 365], default: 0 }
        fulfilment_adapter: { type: string, enum: [none, webhook], default: none }
        fulfilment_endpoint_url: { type: string, maxLength: 255, description: "https URL (http only for localhost), no credentials, query or fragment. Required for webhook." }
        fulfilment_secret: { type: string, minLength: 32, maxLength: 200, description: "Write-only. Printable ASCII with no spaces. Required for webhook unless one is stored." }
        callback_base_url: { type: string, nullable: true, maxLength: 255, description: "Stack callback base URL, http(s); blank clears." }
        escalation_email_recipients:
          description: Email addresses, at most 10; a list or a newline-separated string.
          oneOf:
            - type: array
              items: { type: string, format: email }
              maxItems: 10
            - type: string
    AiSsaAudit:
      type: object
      required: [instance_id, client_name, day, timezone, audit_records, interactions]
      properties:
        instance_id: { type: integer }
        client_name: { type: string }
        day: { type: string, nullable: true, example: "2026-10-27" }
        timezone: { type: string, nullable: true, example: Australia/Perth }
        audit_records:
          type: object
          additionalProperties: true
          description: 'Sidecar payload, typically {records: [...], total_closed}. Shape owned by the sidecar. May be an empty array if that call failed.'
        interactions:
          type: object
          additionalProperties: true
          description: 'Sidecar payload, typically {records: [...], total}. Shape owned by the sidecar. May be an empty array if that call failed.'
    AiSsaEscalationRequest:
      type: object
      required: [channel, reason, summary, idempotency_key]
      properties:
        channel: { type: string, pattern: '^[a-z][a-z0-9-]{1,19}$', description: 'Lower-cased, trimmed. Typically chat, email or phone.' }
        reason: { type: string, pattern: '^[a-z][a-z0-9_]{1,49}$', description: 'Lower-case slug. Suggested customer_request, out_of_scope, low_confidence, complaint, urgent, fulfilment_failed, other.' }
        summary: { type: string, maxLength: 2000, description: Non-empty after trimming; control characters (except newlines) removed. }
        idempotency_key: { type: string, pattern: '^[A-Za-z0-9._:-]{8,100}$' }
        interaction_ref: { type: string, nullable: true, maxLength: 100 }
        occurred_at: { type: string, nullable: true, description: "ISO 8601 date and time (must start YYYY-MM-DDTHH:MM)." }
        test_mode: { type: boolean, default: false }
    AiSsaEscalationResult:
      type: object
      required: [id, status, duplicate, notified]
      properties:
        id: { type: integer }
        status: { type: string }
        duplicate: { type: boolean }
        notified: { type: boolean }
    # ---------------------------------------------------------------- KPI
    KpiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    KpiEntryRequest:
      type: object
      required: [key, period_start, value]
      properties:
        key: { type: string, description: Active metric key. }
        period_start: { type: string, description: "YYYY-MM-DD; must be the start date of an existing period of the metric's cadence.", example: "2026-10-26" }
        value:
          description: Numeric (a number or numeric string). Stored as a float.
          oneOf:
            - { type: number }
            - { type: string }
        note: { type: string, nullable: true, description: Cast to string when present. }
    KpiEntryResponse:
      type: object
      required: [entry]
      properties:
        entry:
          type: object
          properties:
            key: { type: string }
            period_start: { type: string, example: "2026-10-26" }
            value: { type: number }
            note: { type: string, nullable: true }
            source: { type: string, enum: [api] }
    # ---------------------------------------------------------------- Licensing
    LiceCheckinRequest:
      type: object
      required: [key, module]
      properties:
        key: { type: string, description: The licence key (never echoed back). }
        module: { type: string, description: Module code the key must cover. }
    LiceCheckinValid:
      type: object
      required: [valid, expires_at]
      properties:
        valid: { type: boolean, enum: [true] }
        expires_at: { type: string, nullable: true, description: "Last day covered, Y-m-d UTC; null for no expiry.", example: "2027-06-30" }
    LiceCheckinInvalid:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean, enum: [false] }
    # ---------------------------------------------------------------- Transactions
    TxnPublicQuoteRequest:
      type: object
      required: [organisation, contact_name, email, items]
      properties:
        organisation: { type: string, maxLength: 200, description: "Required. Tags stripped, whitespace collapsed." }
        contact_name: { type: string, maxLength: 200, description: Required. }
        email: { type: string, maxLength: 255, format: email, description: "Required; must contain a dot." }
        phone: { type: string, maxLength: 50 }
        role_title: { type: string, maxLength: 100 }
        delivery_suburb: { type: string, maxLength: 100 }
        postcode: { type: string, maxLength: 10, pattern: '^\d{4}$', description: Four digits when given. }
        po_number: { type: string, maxLength: 100 }
        notes: { type: string, maxLength: 2000, description: Line breaks kept. }
        website: { type: string, description: "Honeypot. Leave empty (hidden on the page); anything here discards the request with a fake success." }
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: At least one. On a form-encoded body this may be a JSON string.
          items:
            type: object
            required: [sku, qty]
            properties:
              sku: { type: string, maxLength: 100 }
              qty: { description: "Whole number 1 to 999 (integer or digit string, at most 3 digits).", oneOf: [{ type: integer, minimum: 1, maximum: 999 }, { type: string, pattern: '^\d{1,3}$' }] }
    TxnPublicQuoteAccepted:
      type: object
      required: [ok, reference, message, unpriced]
      properties:
        ok: { type: boolean, enum: [true] }
        reference: { type: string, example: QR-1234, description: "QR-<draft document id>." }
        message: { type: string }
        unpriced:
          type: array
          description: SKUs the catalogue did not know; placed on the quote at 0.00 to be priced by hand.
          items: { type: string }
    TxnPublicQuoteFailure:
      type: object
      required: [ok, error, message]
      properties:
        ok: { type: boolean, enum: [false] }
        error:
          type: string
          description: Machine key.
          enum: [method_not_allowed, origin_not_allowed, origin_required, validation, rate_limited, not_configured, failed]
        message: { type: string }
        errors:
          type: object
          description: 'Field to message for `validation`; `{limit: ...}` for `rate_limited`.'
          additionalProperties: { type: string }
    # ---------------------------------------------------------------- Store
    StoreQuoteRequest:
      type: object
      required: [email, items]
      properties:
        name: { type: string, description: "Contact name (alias contact_name). Required in practice (Transactions validation: contact_name)." }
        contact_name: { type: string }
        email: { type: string, format: email }
        organization: { type: string, description: "Alias organisation. Defaults to the contact name, then 'Direct Customer'." }
        organisation: { type: string }
        phone: { type: string }
        suburb: { type: string, description: Delivery suburb. }
        postcode: { type: string, pattern: '^\d{4}$' }
        notes: { type: string }
        website: { type: string, description: "Honeypot; must be empty." }
        items:
          type: array
          description: Items with a blank sku are dropped; qty (alias quantity) defaults to 1 and is raised to at least 1.
          items:
            type: object
            properties:
              sku: { type: string }
              qty: { type: integer, minimum: 1 }
              quantity: { type: integer, minimum: 1 }
    StoreQuoteAccepted:
      type: object
      required: [ok, reference, itemCount, message]
      properties:
        ok: { type: boolean, enum: [true] }
        reference: { type: string, description: "QR-<id> from Transactions, or BDX-QR-<8 hex> from the non-persisting fallback.", example: QR-1234 }
        itemCount: { type: integer }
        message: { type: string }
        unpriced: { type: array, items: { type: string }, description: Present only on the Transactions path. }
    StoreQuoteFailure:
      type: object
      required: [ok, error, message]
      properties:
        ok: { type: boolean, enum: [false] }
        error: { type: string, description: "validation, rate_limited, a Transactions QuoteRequestFailed key (not_configured, failed), or fallback keys invalid_email, missing_name, empty_basket." }
        message: { type: string }
        errors: { type: object, additionalProperties: { type: string }, description: Field to message (validation only). }
    StoreSearchResponse:
      type: object
      required: [ok, query, count, products]
      properties:
        ok: { type: boolean }
        query: { type: string }
        count: { type: integer }
        products:
          type: array
          maxItems: 30
          items:
            type: object
            properties:
              id: { type: integer }
              sku: { type: string }
              name: { type: string }
              slug: { type: string }
              brand: { type: string, example: biolDEx }
              price_cents: { type: integer }
              price_display: { type: string, example: "$45.00 AUD", description: 'Or "RFQ / Concierge" when price_cents is 0.' }
              requires_quote: { type: boolean }
              fulfilment: { type: string }
    # ---------------------------------------------------------------- Lin
    LinError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    LinMedia:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [image, video, document] }
        title: { type: string, nullable: true }
        alt_text: { type: string, nullable: true }
    LinDraft:
      type: object
      properties:
        id: { type: integer }
        display_id: { type: string, example: LIN-20261028-001 }
        target_id: { type: integer }
        status: { type: string, enum: [draft, in_review, approved, scheduled, publishing, published, rejected, failed, exported, posted_manually] }
        status_label: { type: string }
        body: { type: string }
        hashtags: { type: string, nullable: true }
        first_comment: { type: string, nullable: true }
        ai_disclosure_text: { type: string, nullable: true }
        source_ref: { type: string, nullable: true }
        scheduled_for: { type: string, nullable: true }
        published_at: { type: string, nullable: true }
        rejected_reason: { type: string, nullable: true }
        media: { type: array, items: { $ref: "#/components/schemas/LinMedia" } }
        created_at: { type: string }
        updated_at: { type: string }
    LinDraftWithReview:
      allOf:
        - $ref: "#/components/schemas/LinDraft"
        - type: object
          properties:
            review:
              type: array
              items:
                type: object
                properties:
                  action: { type: string, enum: [edited, rejected, approved, published, unapproved_by_edit] }
                  by: { type: string, nullable: true, description: Operator code. }
                  note: { type: string, nullable: true }
                  diff: { type: string, nullable: true }
                  at: { type: string }
    LinDraftCreateRequest:
      type: object
      required: [target_id, body]
      properties:
        target_id: { type: integer, minimum: 1, description: An active target (see /lin/api/context). }
        body: { type: string, description: 'Post text; trimmed, non-empty. LinkedIn commentary limit is 3000 characters but this endpoint does not enforce it.' }
        hashtags: { type: string, nullable: true, maxLength: 500, description: Longer input is trimmed with an ellipsis. }
        first_comment: { type: string, nullable: true }
        source_ref: { type: string, nullable: true, maxLength: 255 }
        submit: { type: boolean, default: false, description: "Any truthy value moves the draft to in_review immediately." }
    LinDraftUpdateRequest:
      type: object
      description: Only these keys are read; others are ignored.
      properties:
        body: { type: string }
        hashtags: { type: string, nullable: true, maxLength: 500 }
        first_comment: { type: string, nullable: true }
        source_ref: { type: string, nullable: true, maxLength: 255 }
        target_id: { type: integer, description: "Only changeable while the post is a draft (agent role)." }
    LinContext:
      type: object
      properties:
        house_rules: { type: string }
        published_prices: { type: array, items: { type: string } }
        main_phone: { type: string }
        url_allowlist: { type: array, items: { type: string } }
        locked_texts:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              body: { type: string }
        grounding: { type: string }
        recently_posted: { type: array, items: { type: string, maxLength: 200 } }
        targets:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              label: { type: string }
              kind: { type: string, enum: [member_api, company_manual] }
    # ---------------------------------------------------------------- MAAMA
    MaamaError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    MaamaStatus:
      type: string
      enum: [open, in_progress, blocked, done, closed, superseded]
    MaamaPriority:
      type: string
      enum: [low, normal, high, critical]
    MaamaUser:
      type: object
      nullable: true
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
    MaamaAgent:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
        role_name: { type: string }
        description: { type: string, nullable: true }
        persistent_context: { type: string, nullable: true }
        attributes: { type: object, additionalProperties: true }
        updated_at: { type: string }
    MaamaHandover:
      type: object
      properties:
        id: { type: integer }
        display_id: { type: string, example: MAA-20261028-001 }
        created_on: { type: string, nullable: true }
        source: { $ref: "#/components/schemas/MaamaUser" }
        target: { $ref: "#/components/schemas/MaamaUser" }
        owner: { $ref: "#/components/schemas/MaamaUser" }
        type: { type: string, example: handover }
        priority: { $ref: "#/components/schemas/MaamaPriority" }
        status: { $ref: "#/components/schemas/MaamaStatus" }
        subject: { type: string, maxLength: 600 }
        source_session: { type: string, nullable: true }
        context: { type: string, nullable: true }
        content: { type: string, nullable: true }
        related: { type: string, nullable: true }
        est_time: { type: string, nullable: true, description: "As in the register: `<5m`, `15m`, `2h`, `1h/run`, `?`." }
        target_mode: { type: string, nullable: true, enum: [once, ongoing], description: Local (Gwen) agent mode; null for other targets. }
        status_note: { type: string, nullable: true, description: Free text beside status. }
        register_note: { type: string, nullable: true, description: The register's short Notes column. }
        created_at: { type: string }
        updated_at: { type: string }
    MaamaHandoverDetail:
      allOf:
        - $ref: "#/components/schemas/MaamaHandover"
        - type: object
          properties:
            updates:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  actor: { $ref: "#/components/schemas/MaamaUser" }
                  note: { type: string, nullable: true }
                  actor_label: { type: string, nullable: true, description: Actor string as written in an imported detail file; null for entries made in the module. }
                  status_after: { $ref: "#/components/schemas/MaamaStatus" }
                  created_at: { type: string }
    MaamaHandoverCreateRequest:
      type: object
      required: [subject, target_user_id]
      properties:
        subject: { type: string, maxLength: 600 }
        target_user_id: { type: integer, minimum: 1, description: An existing user id (integer or digit string). }
        priority: { $ref: "#/components/schemas/MaamaPriority" }
        owner_user_id: { type: integer, nullable: true }
        type: { type: string, maxLength: 200, default: handover }
        source_session: { type: string, maxLength: 300 }
        context: { type: string }
        content: { type: string }
        related: { type: string }
        est_time: { type: string, maxLength: 40 }
        target_mode: { type: string, nullable: true, enum: [once, ongoing] }
        status_note: { type: string, nullable: true }
        register_note: { type: string, nullable: true }
    MaamaHandoverUpdateRequest:
      type: object
      properties:
        subject: { type: string, maxLength: 200, description: Cannot be blank. }
        target_user_id: { type: integer }
        owner_user_id: { type: integer, nullable: true }
        priority: { $ref: "#/components/schemas/MaamaPriority" }
        status: { $ref: "#/components/schemas/MaamaStatus" }
        type: { type: string, maxLength: 200 }
        source_session: { type: string, maxLength: 300, nullable: true }
        context: { type: string, nullable: true }
        content: { type: string, nullable: true }
        related: { type: string, nullable: true }
        est_time: { type: string, maxLength: 40, nullable: true }
        target_mode: { type: string, nullable: true, enum: [once, ongoing] }
        status_note: { type: string, nullable: true }
        register_note: { type: string, nullable: true }
        expect_status: { $ref: "#/components/schemas/MaamaStatus", description: "Precondition: 409 if the handover's status is not this." }
        note: { type: string, description: Recorded on the trail entry. }
    MaamaNoteRequest:
      type: object
      required: [note]
      properties:
        note: { type: string, description: Non-blank. }
        status: { $ref: "#/components/schemas/MaamaStatus" }
    # ---------------------------------------------------------------- Requirements
    ReqError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    ReqStatus:
      type: string
      enum: [open, in_progress, done_pending_changelog_decision, complete, hold]
    ReqType:
      type: string
      enum: [functional, user, internal, note]
    ReqPriority:
      type: string
      enum: [low, normal, high]
    ReqRequirement:
      type: object
      properties:
        id: { type: integer }
        display_id: { type: string, example: REQ-203 }
        title: { type: string }
        description: { type: string, nullable: true }
        type: { $ref: "#/components/schemas/ReqType" }
        status: { $ref: "#/components/schemas/ReqStatus" }
        priority: { $ref: "#/components/schemas/ReqPriority" }
        notes: { type: string, nullable: true }
        project: { type: string, nullable: true }
        branch: { type: string, nullable: true }
        target_version: { type: string, nullable: true }
        changelog_decision: { type: string, nullable: true, enum: [included, excluded_deliberately, null] }
        changelog_id: { type: integer, nullable: true }
        changelog_note: { type: string, nullable: true }
        origin_session: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }
    ReqCreateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, description: 'Trimmed, non-empty.' }
        description: { type: string }
        type: { $ref: "#/components/schemas/ReqType" }
        priority: { $ref: "#/components/schemas/ReqPriority" }
        status: { $ref: "#/components/schemas/ReqStatus" }
        origin_session: { type: string }
        project: { type: string }
        branch: { type: string }
        target_version: { type: string }
        notes: { type: string }
    ReqUpdateRequest:
      type: object
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        type: { $ref: "#/components/schemas/ReqType" }
        priority: { $ref: "#/components/schemas/ReqPriority" }
        status: { $ref: "#/components/schemas/ReqStatus" }
        changelog_decision: { type: string, enum: [included, excluded_deliberately], description: "Required when status is complete (forced to included if already linked to a changelog)." }
        changelog_note: { type: string, nullable: true }
        origin_session: { type: string, nullable: true }
        project: { type: string, nullable: true }
        branch: { type: string, nullable: true }
        target_version: { type: string, nullable: true }
        notes: { type: string, nullable: true }
