tags:
  - name: Announcements
    description: Staff, agent and customer notices (plugins/announcements). Read for any authenticated principal, filtered by audience; create/publish is admin only and idempotent on source + external_id.
  - name: Forum
    description: Headless Forum plugin (plugins/forum). Games push identity, alliance, membership and tutorial events to one endpoint; the plugin stores them idempotently and adapts them to Flarum asynchronously.
  - name: Catalogue
    description: Read-only product catalogue for external frontends (plugins/catalogue) plus an authenticated quote-request ticket intake.
  - name: AI SSA Chat
    description: Public chat-widget proxy to an AI SSA instance's sidecar (embed-token authenticated) and the admin-only widget configuration API (plugins/ai-ssa-chat).
  - name: AI SSA Email
    description: Admin-only mailbox configuration and one-time baseline pass for an AI SSA instance's email channel (plugins/ai-ssa-email).
  - name: AI SSA Phone
    description: Admin-only phone line configuration and call listing for an AI SSA instance (plugins/ai-ssa-phone).
  - name: AI SSA
    description: AI Sales and Support Agent core (applications/ai-ssa-application). Admin-only instance provisioning and audit proxy, plus the HMAC-signed escalation intake the sidecar calls.
  - name: KPI
    description: Key Performance Indicators module (internal/kpi-module). One endpoint lets an agent or cron push a metric actual for a period.
  - name: Licensing
    description: Licensing module (internal/licensing-module). Cross-instance licence check-in authenticated by the key itself.
  - name: Transactions
    description: Transactions module (applications/transactions). Public, CORS allow-listed quote-request intake that creates a draft quote.
  - name: Store
    description: XTen Commerce Storefront (applications/store). Public instant search and public quote submission that bridges into Transactions.
  - name: Lin
    description: Lin Review and Publish (internal/lin-module). The agent-facing door for LinkedIn post drafts; nothing here can approve or publish.
  - name: MAAMA
    description: Multi AI and Agent module (internal/maama-module). Handover register and agent profile lookup for staff and agents.
  - name: Requirements
    description: Requirements module (internal/requirements-module). JSON list/view/create/update for requirements (REQ-nnn), reached through the module's generic routing.

paths:
  /api/announcements:
    get:
      tags: [Announcements]
      operationId: ann_list
      summary: List published announcements visible to the caller
      description: |
        Any authenticated principal (session or API key), every role including `member`. Only published rows are returned (`published_at` set), newest first, no pagination. Audience filtering by caller role:
        admin/operator see `everyone`, `all`, `staff`; `agent`/`charter_agent` see `everyone`, `all`; any other role (e.g. `member`) sees `everyone` only.
        Expired rows (`expires_at` in the past) are excluded unless `include_expired=1`. An unrecognised `severity` or an unparseable `since` is silently ignored rather than rejected. Expiry events are detected and fired as a side effect of each read.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: include_expired
          in: query
          required: false
          description: Only the exact value `1` includes expired announcements.
          schema: { type: string, example: "1" }
        - name: severity
          in: query
          required: false
          description: Filter by severity. Accepts `info`, `notice`, `important` and the aliases `warning` (notice) and `critical` (important), case-insensitive. Anything else is ignored.
          schema: { type: string, example: important }
        - name: since
          in: query
          required: false
          description: Only announcements with `published_at` on or after this date/time (anything PHP strtotime parses). Unparseable values are ignored.
          schema: { type: string, example: "2026-10-01" }
      responses:
        "200":
          description: Announcements visible to the caller.
          content:
            application/json:
              schema:
                type: object
                required: [announcements]
                properties:
                  announcements:
                    type: array
                    items: { $ref: "#/components/schemas/AnnAnnouncement" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnError" }
              example: { error: Not authenticated }
    post:
      tags: [Announcements]
      operationId: ann_create
      summary: Create (or idempotently update) an announcement
      description: |
        Admin role only. Operator, agent and charter_agent keys get 403 (Travis 27 Sep 2026: charter agents must not create or publish announcements). The body is parsed as JSON whatever the Content-Type; an unparseable or empty body behaves as `{}` and fails validation with 422.
        Drafts by default: `publish` defaults to false, so an admin presses Publish later. `author_user_id` is always the authenticated caller, never taken from the body.

        Idempotency: when `source` and `external_id` are both sent and a row with that pair exists, the call updates that row and answers 200 `created:false` with the same `id` instead of creating a duplicate. On such an update `title`, `body`, `severity`, `expires_at` and `source_url` are overwritten with the submitted values (so omitting `source_url` or `expires_at` clears them; title and body are always required); `audience` changes only when the body explicitly contains an `audience` key. `publish:true` publishes a still-draft row and never un-publishes. New rows answer 201 `created:true`.
        Events: `announcements:created` fires when a row becomes published, `announcements:updated` when an already-published row changes. All validation problems are returned together in one 422.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnCreateRequest" }
            example:
              title: Planned maintenance window
              body: Stack will be briefly unavailable on Sunday 02:00-02:15 AWST.
              severity: notice
              audience: all
              publish: true
              expires_at: "2026-11-01"
              source: onedrive-inbox
              external_id: maintenance-2026-11-01
              source_url: https://example.test/inbox/maintenance.md
      responses:
        "200":
          description: An existing row (same source + external_id) was updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnWriteResult" }
        "201":
          description: A new announcement was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnWriteResult" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnError" }
        "403":
          description: Caller is not an admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnError" }
              example: { error: "Forbidden: requires role admin" }
        "422":
          description: Validation failed (`errors` is a field to message map) or the row could not be saved (`error` only, model messages joined).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnValidationError" }
              example:
                error: Validation failed
                errors: { title: title is required, source: source is required when external_id is given }

  /api/announcements/{id}:
    get:
      tags: [Announcements]
      operationId: ann_get
      summary: Get one announcement
      description: |
        Any authenticated principal. A draft is visible to admin/operator only; for everyone else (and for an announcement whose audience the caller may not read) the answer is 404, not 403, so unannounced or internal rows are not confirmed to exist. Expired rows are still returned here.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The announcement.
          content:
            application/json:
              schema:
                type: object
                required: [announcement]
                properties:
                  announcement: { $ref: "#/components/schemas/AnnAnnouncement" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnError" }
        "404":
          description: Not found, a draft the caller may not see, or an audience the caller may not read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnError" }
              example: { error: Announcement not found }

  /api/forum/v1/events:
    post:
      tags: [Forum]
      operationId: forum_events_create
      summary: Submit a game event envelope
      description: |
        Authenticated by `Authorization: Bearer <per-game key>` (or `X-Api-Key`): the key belongs to a per-game Stack service user. Authentication happens before the body is parsed. Any role resolves, but the principal's user id must equal the registered game's `service_user_id`; otherwise 403.
        Order of checks: 401 (no/invalid key) -> 400 (body is not a JSON object; a JSON array or empty body counts) -> 404 (`game_key` missing, unknown, or the game is disabled) -> 403 (key not authorised for that game) -> 422 (envelope or payload invalid) -> store.
        Idempotency: `event_id` is unique. A replay of a stored `event_id` answers 202 `duplicate:true` and is not re-validated against the stored payload (the first accepted payload wins). The event is stored as pending and applied to Flarum asynchronously by the queue worker; 202 means stored, not applied. Every 4xx is permanent for the game (dead-letter), per the contract; the game treats any 2xx as delivered. Events for one lane (entity, or the player for membership events) are applied in `occurred_at` order.
        `event_id` must equal `{game_key}:{event_type}:{entity_key}:{sequence}`; the sequence is chosen by the game, unique per emission, and kept on retry.
        Event types: user.upsert, alliance.upsert, membership.active, membership.revoked, alliance.archived, tutorial.post.upsert. Source of truth: plugins/forum/src/Envelope.php and plugins/docs/Forum-Service-Interface-v0.1.md.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForumEnvelope" }
            examples:
              user_upsert:
                summary: user.upsert
                value:
                  event_id: "xwar-legacy:user.upsert:user:1:1234:202610261200000000-abc123"
                  entity_key: "user:1:1234"
                  sequence: "202610261200000000-abc123"
                  event_type: user.upsert
                  game_key: xwar-legacy
                  universe_id: 1
                  occurred_at: "2026-10-26T12:00:00Z"
                  payload:
                    user:
                      game_key: xwar-legacy
                      universe_id: 1
                      game_user_id: 1234
                      username: Commander
                      email: commander@example.test
                      language: en
                      profile:
                        avatar_url: null
                        alliance_tag: XTEN
                        join_date: "2026-10-26T12:00:00Z"
              membership_active:
                summary: membership.active
                value:
                  event_id: "xwar-legacy:membership.active:membership:1:1234:42:202610261201000000-def456"
                  entity_key: "membership:1:1234:42"
                  sequence: "202610261201000000-def456"
                  event_type: membership.active
                  game_key: xwar-legacy
                  universe_id: 1
                  occurred_at: "2026-10-26T12:01:00Z"
                  payload:
                    membership:
                      game_key: xwar-legacy
                      universe_id: 1
                      game_user_id: 1234
                      game_alliance_id: 42
                      state: active
      responses:
        "202":
          description: Stored (or already stored). Delivery to Flarum is asynchronous.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForumAccepted" }
              examples:
                accepted: { value: { accepted: true, duplicate: false } }
                replay: { value: { accepted: true, duplicate: true } }
        "400":
          description: Body is empty or not a JSON object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForumError" }
              example: { error: Request body must be a JSON object }
        "401":
          description: No valid API key or session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForumError" }
              example: { error: Not authenticated }
        "403":
          description: The authenticated user is not the service user of the claimed game.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForumError" }
              example: { error: This API key is not authorised for game xwar-legacy }
        "404":
          description: Unknown game (or `game_key` missing, or the game is disabled).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForumError" }
              example: { error: Unknown game xwar-legacy }
        "422":
          description: Envelope or payload failed validation. `errors` maps a field path (for example `event_id`, `payload.user.email`) to a message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForumInvalidEvent" }
              example:
                error: Invalid event
                errors: { payload.user.email: must be a valid email address }

  /api/catalogue/products:
    get:
      tags: [Catalogue]
      operationId: cat_products_list
      summary: List published products for a store
      description: |
        Any authenticated principal (session or API key); no role restriction, so a `member` key works. Only `published`, non-deleted products of the store are listed, ordered quote-required first then newest id first. `q` matches name or SKU case-insensitively (ILIKE, so PostgreSQL only). `limit` is capped at 100 (default 20); `offset` is clamped to 0 or more. Unknown store code answers 404.
      x-unverified: true
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: store
          in: query
          required: false
          description: Store code. Defaults to `bioldex`.
          schema: { type: string, default: bioldex }
        - name: q
          in: query
          required: false
          description: Substring of product name or SKU.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Page size, default 20, capped at 100. A value of 0 or below is not clamped by the code (unverified behaviour).
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: A page of products.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatProductList" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatError" }
        "404":
          description: Store code not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatError" }
              example: { error: "Store 'nosuch' not found." }

  /api/catalogue/products/{slug}:
    get:
      tags: [Catalogue]
      operationId: cat_products_get
      summary: Get one published product by slug
      description: |
        Any authenticated principal. Slug must match `[a-z0-9-]+` or the router does not match (framework 404). Includes images (primary first). 404 for an unknown store or an unpublished/deleted/unknown product.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9-]+$" }
        - name: store
          in: query
          required: false
          description: Store code. Defaults to `bioldex`.
          schema: { type: string, default: bioldex }
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatProductDetail" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatError" }
        "404":
          description: Unknown store or product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatError" }
              example: { error: Product not found }

  /api/catalogue/quote:
    post:
      tags: [Catalogue]
      operationId: cat_quote_create
      summary: Submit a concierge quote request (creates a support ticket)
      description: |
        Requires authentication (any role); this is NOT a public endpoint, unlike the Transactions and Store quote intakes. Body is parsed as JSON regardless of Content-Type.
        Creates a `Tickets` row (type `support`, severity `normal`, status `open`, project `bioldex`, title truncated to 190 characters) when the Tickets model is present; `ticket_id` is null if it is not. The SKU is not checked against the catalogue and the email address is not format-validated. Success is HTTP 200, not 201.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatQuoteRequest" }
            example:
              name: Jane Smith
              email: jane.smith@school.example.test
              phone: "0400 000 000"
              company: Example High School
              sku: BDX-1001
              notes: Please quote 10 units delivered to Perth.
      responses:
        "200":
          description: Request recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatQuoteAccepted" }
        "400":
          description: name, email or sku missing or blank.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatError" }
              example: { error: "Name, email, and product SKU are required." }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatError" }
        "500":
          description: The ticket could not be saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatQuoteFailed" }

  /api/ai-ssa-chat/start:
    post:
      tags: [AI SSA Chat]
      operationId: chat_start
      summary: Open a chat session (public widget call)
      description: |
        Public, unauthenticated; called from a visitor's browser. The embed token is the only access control. Checks in order: `embed_token` present (422); token is 48 lowercase hex and belongs to an enabled widget (else 404, same answer for unknown and disabled); request `Origin` allowed by the widget's `allowed_origins` list (when the list is non-empty the Origin header must be present and match exactly, case-insensitively, trailing slash ignored; an empty list allows any origin including none) (403); AI SSA core available (503); rate limits (429): per client IP min(widget rate, 30/min), per session min(widget rate, 15/min, message only), per widget token (default 120/min, configurable 1-600); then the licence gate (503 "Chat is not available right now", which rule refused is only in the event log).
        CORS: responses carry `Access-Control-Allow-Origin: *`, replaced with the request Origin when the widget has an origin list and Origin was sent. `OPTIONS` answers 204 with the CORS headers. `Cache-Control: no-store`. A visitor never learns which rule refused.
        The returned `session_id` is `web:<32 hex>.<32 hex>`, an HMAC over the embed token and a random nonce; it is stateless and only valid with the token it was issued for.
        The router accepts only POST and OPTIONS here, so the in-controller 405 branch is unreachable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatStartRequest" }
            example: { embed_token: "0123456789abcdef0123456789abcdef0123456789abcdef" }
      responses:
        "200":
          description: Session opened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatStartResponse" }
              example:
                session_id: "web:0123456789abcdef0123456789abcdef.fedcba9876543210fedcba9876543210"
                greeting: "Hi, I'm Tim, Support Specialist at Example Pty Ltd. How can I help?"
                title: Tim
                test_mode: true
        "204":
          description: CORS preflight (OPTIONS) answer; empty body.
        "403":
          description: Origin not in the widget's allowed list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatError" }
              example: { error: This site is not allowed to use this widget }
        "404":
          description: Invalid, malformed or disabled embed token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatError" }
              example: { error: Invalid or disabled embed token }
        "422":
          description: embed_token missing or blank.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatError" }
              example: { error: embed_token is required }
        "429":
          description: Rate limit hit (IP, session or widget).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatError" }
              example: { error: "Too many requests, please slow down" }
        "503":
          description: AI SSA core not available, or the licence/instance gate refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatError" }
              example: { error: Chat is not available right now }

  /api/ai-ssa-chat/message:
    post:
      tags: [AI SSA Chat]
      operationId: chat_message
      summary: Send a visitor message to the assistant (public widget call)
      description: |
        Public, unauthenticated. Same access checks and CORS behaviour as `start` (token, origin, core, rate limits, licence gate), run after body validation. Validation order: `session_id` must match `^[A-Za-z0-9._:-]{8,100}$` and `message` non-empty (422 "session_id and message are required"); `session_id` must be one issued by `start` for this same token (422 "Unknown session: start a new one", which also covers a missing or wrong token); message at most 2000 characters (422); then the admit checks (404/403/503/429). `page_url` is optional, trimmed and cut to 500 characters.
        The message is relayed to the instance's sidecar; a sidecar failure answers 502 "Chat is temporarily unavailable". `OPTIONS` answers 204. Router accepts only POST and OPTIONS.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatMessageRequest" }
            example:
              embed_token: "0123456789abcdef0123456789abcdef0123456789abcdef"
              session_id: "web:0123456789abcdef0123456789abcdef.fedcba9876543210fedcba9876543210"
              message: What are your support hours?
              page_url: https://www.client.example/contact
      responses:
        "200":
          description: The assistant's reply.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessageResponse" }
              example:
                session_id: "web:0123456789abcdef0123456789abcdef.fedcba9876543210fedcba9876543210"
                reply: We are available 9am to 5pm AWST on weekdays.
                escalated: false
                closed: false
                test_mode: true
        "204":
          description: CORS preflight (OPTIONS) answer; empty body.
        "403":
          description: Origin not allowed for this widget.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatError" }
        "404":
          description: Invalid, malformed or disabled embed token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatError" }
        "422":
          description: Bad session id, missing message, unknown session, or message over 2000 characters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatError" }
              example: { error: session_id and message are required }
        "429":
          description: Rate limit hit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatError" }
        "502":
          description: The sidecar did not answer (or no sidecar credentials).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatError" }
              example: { error: Chat is temporarily unavailable }
        "503":
          description: Core unavailable or licence gate refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatError" }

  /api/ai-ssa-chat/widget.js:
    get:
      tags: [AI SSA Chat]
      operationId: chat_widget_js
      summary: Embeddable chat widget script
      description: |
        Public, unauthenticated static JavaScript (plugins/ai-ssa-chat/assets/widget.js), `Cache-Control: public, max-age=300`, `Access-Control-Allow-Origin: *`. `OPTIONS` answers 204. Returns 404 text/plain "Not found" if the asset file is missing from the deployment.
      security: []
      responses:
        "200":
          description: The widget script.
          content:
            application/javascript:
              schema: { type: string }
        "204":
          description: CORS preflight (OPTIONS) answer; empty body.
        "404":
          description: Asset file missing.
          content:
            text/plain:
              schema: { type: string, example: Not found }

  /api/ai-ssa-chat/config/{instanceId}:
    get:
      tags: [AI SSA Chat]
      operationId: chat_config_get
      summary: Get an instance's chat widget settings and channel state
      description: |
        Admin role only (session or API key). The answer always carries the channel's licence-gate state ("Licence required" is a state, not an error), and `config` is null until a widget exists. The embed token is returned in full to admins.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - { name: instanceId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Channel state and widget config.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatConfigResponse" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatError" }
        "403":
          description: Caller is not an admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatError" }
              example: { error: Forbidden }
        "404":
          description: Instance not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatErrors" }
        "503":
          description: The AI SSA core is not enabled or too old.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatErrors" }
    put:
      tags: [AI SSA Chat]
      operationId: chat_config_put
      summary: Create or update an instance's chat widget
      description: |
        Admin role only. Creates the instance's one widget if none exists (a new widget is enabled, rate limit 120, with a generated 48-hex embed token), otherwise updates it. Always answers 200, including on create. Only the fields sent are changed. `instance_id` in the body is ignored on create (the path wins) and rejected on update. Send `rotate_token: true` to replace the embed token (the old one stops working). A session-cookie caller must send `Content-Type: application/json` (415 otherwise); API-key callers are not checked. `pushed` reports the config push to the sidecar: null none due, true acknowledged, false failed (the row is saved regardless).
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - { name: instanceId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatConfigRequest" }
            example:
              greeting_override: Hi, how can we help today?
              widget_title: Support
              allowed_origins: ["https://www.client.example"]
              rate_limit_per_minute: 120
              enabled: true
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatConfigSaved" }
        "401":
          description: No valid session or API key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatError" }
        "403":
          description: Caller is not an admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatError" }
        "404":
          description: Instance not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatErrors" }
        "415":
          description: Session caller sent a non-JSON Content-Type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatError" }
        "422":
          description: Validation failed, instance already has a widget (cannot happen via this route), or instance missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatErrors" }
              example:
                error: Rate limit must be between 1 and 600 requests a minute
                errors: ["Rate limit must be between 1 and 600 requests a minute"]
        "503":
          description: The AI SSA core is not enabled or too old.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatErrors" }

