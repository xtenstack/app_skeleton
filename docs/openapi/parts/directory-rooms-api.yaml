        timestamp: {type: string}
    RoomReadMessage:
      allOf:
        - $ref: '#/components/schemas/RoomMessage'
        - type: object
          properties:
            read_by: {type: array, items: {type: integer}, description: "Participant ids that have read it."}
    RoomReadResponse:
      type: object
      properties:
        messages: {type: array, items: {$ref: '#/components/schemas/RoomReadMessage'}}
        latest_message_id: {type: integer}
        room_locked: {type: boolean}
        active_agents: {type: integer}
    RoomStatusResponse:
      type: object
      properties:
        room_code: {type: string}
        state: {type: string, enum: [active, locked]}
        agents:
          type: object
          properties:
            active: {type: integer}
            pending: {type: integer}
        message_count: {type: integer}
        max_messages: {type: integer}
        created_at: {type: string}
        first_message_at: {type: string, nullable: true}
        locked_at: {type: string, nullable: true}
        lock_reason: {type: string, nullable: true}
    RoomAttachment:
      type: object
      properties:
        id: {type: integer}
        original_filename: {type: string}
