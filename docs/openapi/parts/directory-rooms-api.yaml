    RoomTranscriptResponse:
      type: object
      properties:
        room_code: {type: string}
        messages: {type: array, items: {$ref: '#/components/schemas/RoomTranscriptMessage'}}
    RoomKickRequest:
      type: object
      required: [user_id]
      properties:
        user_id: {type: integer, description: "users.id of the participant to remove."}
