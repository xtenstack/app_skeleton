          description: Honeypot tripped; nothing saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreOk'
              example:
                ok: true
        '201':
          description: Intake saved and token consumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreOk'
              example:
                ok: true
          headers:
            Access-Control-Allow-Origin:
              description: Echoes the Origin when it is https://deploy.xten.au or https://xten.au; absent otherwise.
