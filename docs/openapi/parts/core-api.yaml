      summary: Submit the Data Restore Audit intake form
      description: 'Public: no API key or session. Authorised instead by the single-use `token` returned once when the ticket was created with `generate_intake_token`. Explicit route registered for POST and OPTIONS (the generic route also reaches the action; non-POST returns 405 from the action; preflight returns 204; CORS allowed for https://deploy.xten.au and https://xten.au). The token is cleared on success so the link cannot be replayed; an unknown token and an already-used token give the same 404. A non-empty `company_website` honeypot returns 200 `{"ok":true}` without saving anything (indistinguishable from success except for status 200 vs 201). Note the check order: token presence (422), token lookup (404), then `intake` validity (422), so a bad `intake` does not consume the token. No rate limiting in code.'
