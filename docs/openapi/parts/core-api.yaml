tags:
  - name: 'Core: Index'
    description: Root and fallback behaviour of the core `/api` module (health probe, JSON 404 and 500 bodies).
  - name: 'Core: Session'
    description: Cookie-session login, whoami and logout for browser callers; these endpoints reject API keys.
  - name: 'Core: Tickets'
    description: Create, read, claim, close and converse on tickets ("REQ"s) through the authenticated API.
  - name: 'Core: KB Articles'
    description: Authenticated read and (admin-only) authoring access to Knowledge Base articles, including enquiry-type matching.
  - name: 'Core: Public KB'
    description: Unauthenticated read-only feed of published public FAQ articles, with CORS for XTen origins.
  - name: 'Core: Public Intake'
    description: Unauthenticated, token-gated, single-use intake-form submission for the Data Restore Audit landing page.
  - name: 'Core: Provision'
    description: Admin-oriented API for creating users with role sets, issuing, rotating and revoking API keys, and deactivating users.
  - name: 'Core: Watson'
    description: Watson close-offer action that creates the Dolibarr Third Party, Project and sales order(s) for a published-price offer.
paths:
  /api:
    get:
      tags:
        - 'Core: Index'
      operationId: core_index_index
      summary: API root probe
      description: |-
        Returns a static liveness body. Reached via the generic `/api/:params` route (also `/api/index` and `/api/index/index`); any HTTP method is accepted (no method check). Who: any authenticated caller (any role, API key or session). Unauthenticated callers get 401. Authentication: `X-Api-Key: <key>` or `Authorization: Bearer <key>`; a browser session cookie (from `POST /api/session/login`) is accepted only when no key header is sent. 

        Fallback behaviour for the whole module: an `/api/...` URL whose controller or action does not exist (or an action missing a required id segment) is forwarded to `IndexController::notFoundAction()` and, for an authenticated caller, returns 404 `{"error":"Not Found"}` (capital N, unlike the per-record `{"error":"Not found"}`). Unauthenticated callers get 401 first. Any exception escaping an action returns 500 `{"error":"Internal server error"}`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Liveness body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
              example:
                ok: true
                service: app_skeleton api
        '401':
          description: No credentials, or the presented API key does not resolve (unknown, revoked, expired, or owner inactive). A presented key is never combined with a session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not authenticated
        '404':
          description: Unknown /api endpoint (authenticated caller).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not Found
        '500':
          description: Uncaught server error (logged server-side).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Internal server error
  /api/session/login:
    post:
      tags:
        - 'Core: Session'
      operationId: core_session_login
      summary: Log in with email and password (cookie session)
      description: 'Public (no key or session required) but must NOT carry an API key: a request with `Authorization: Bearer` or `X-Api-Key` is rejected with 400. Body is JSON `{email,password}`; form fields `email`/`password` are accepted as a fallback. On success a session cookie is set and the user payload returned. Failed attempts are audited; once 5 failed logins have been recorded for the same email OR the same client IP in the last 15 minutes, further attempts are refused (password not even checked) with the same 401 body as a wrong password. Only active users can log in. Non-POST returns 405.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoreLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CoreLoginRequest'
      responses:
        '200':
          description: Logged in; Set-Cookie carries the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreSessionUserEnvelope'
              example:
                user:
                  id: 12
                  email: operator@example.invalid
                  role_id: 2
                  role_ids:
                    - 2
                    - 5
        '400':
          description: An API key header was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Session endpoints do not accept an API key
        '401':
          description: Wrong credentials, inactive user, or rate-limited (indistinguishable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Invalid email or password
        '405':
          description: Wrong HTTP method; checked inside the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: POST required
  /api/session/me:
    get:
      tags:
        - 'Core: Session'
      operationId: core_session_me
      summary: Current session user
      description: Returns the user stored in the cookie session. Public route, but requires a logged-in session; 401 otherwise. Rejects API keys with 400 (use any other authenticated endpoint to test a key). Any HTTP method is accepted (no method check).
      security: []
      responses:
        '200':
          description: Session user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreSessionUserEnvelope'
        '400':
          description: An API key header was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Session endpoints do not accept an API key
        '401':
          description: No session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not authenticated
  /api/session/logout:
    post:
      tags:
        - 'Core: Session'
      operationId: core_session_logout
      summary: Log out (destroy session auth)
      description: Clears the session auth and settings. Always returns 200, even when not logged in. Any HTTP method is accepted (no method check, no CSRF protection). Rejects API keys with 400.
      security: []
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreOk'
              example:
                ok: true
        '400':
          description: An API key header was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Session endpoints do not accept an API key
  /api/tickets:
    get:
      tags:
        - 'Core: Tickets'
      operationId: core_tickets_index
      summary: List tickets
      description: 'Who: any authenticated caller, any role. Note: there is NO per-caller scoping here, so every authenticated principal (including `member` and any agent key) can list every ticket in the system. Ordered newest id first, no pagination or limit. Any HTTP method is accepted by the router (no method check). Authentication: `X-Api-Key: <key>` or `Authorization: Bearer <key>`; a browser session cookie (from `POST /api/session/login`) is accepted only when no key header is sent. '
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: Exact status match (open, in_review, consolidated, closed seen in code). Unknown value returns an empty list.
        - name: reporter_user_id
          in: query
          schema:
            type: integer
          description: Filter by reporting user id. A value of 0 or non-numeric is ignored.
      responses:
        '200':
          description: Tickets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTicketList'
        '401':
          description: No credentials, or the presented API key does not resolve (unknown, revoked, expired, or owner inactive). A presented key is never combined with a session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not authenticated
        '500':
          description: Uncaught server error (logged server-side).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Internal server error
  /api/tickets/create:
    post:
      tags:
        - 'Core: Tickets'
      operationId: core_tickets_create
      summary: Create a ticket
      description: 'Who: any authenticated caller, any role (agents included). Reporter user and API key are always taken from the caller, never from the body. Not idempotent: every call creates a new ticket, and `source_ref` is not de-duplicated. Unknown `ticket_type` silently becomes `bug` and unknown `severity` silently becomes `normal`. With `generate_intake_token` a random 64-hex token is generated and returned once as `intake_token` for `POST /api/intake/data-restore-audit`. Non-POST returns 405. Authentication: `X-Api-Key: <key>` or `Authorization: Bearer <key>`; a browser session cookie (from `POST /api/session/login`) is accepted only when no key header is sent. '
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoreTicketCreateRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTicketCreateResponse'
        '401':
          description: No credentials, or the presented API key does not resolve (unknown, revoked, expired, or owner inactive). A presented key is never combined with a session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not authenticated
        '405':
          description: Wrong HTTP method; checked inside the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: POST required
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: title is required
        '500':
          description: Uncaught server error (logged server-side).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Internal server error
  /api/tickets/view/{id}:
    get:
      tags:
        - 'Core: Tickets'
      operationId: core_tickets_view
      summary: Get one ticket
      description: 'Who: any authenticated caller, any role. As with the list, there is no ownership check, so any principal can read any ticket by id. Any HTTP method is accepted. A missing id segment (`/api/tickets/view`) yields the generic 404 `Not Found`. Authentication: `X-Api-Key: <key>` or `Authorization: Bearer <key>`; a browser session cookie (from `POST /api/session/login`) is accepted only when no key header is sent. '
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric record id. Not cast or validated by the action; a non-numeric value is handed to the database (behaviour unverified, probably a 500).
          schema:
            type: integer
            minimum: 1
          example: 42
      responses:
        '200':
          description: Ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTicketEnvelope'
        '401':
          description: No credentials, or the presented API key does not resolve (unknown, revoked, expired, or owner inactive). A presented key is never combined with a session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not authenticated
        '404':
          description: Unknown record (or unknown endpoint for an authenticated caller).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not found
        '500':
          description: Uncaught server error (logged server-side).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Internal server error
      x-unverified: true
  /api/tickets/retest-result/{id}:
    post:
      tags:
        - 'Core: Tickets'
      operationId: core_tickets_retestResult
      summary: Report an automated retest result
      description: 'Who: any authenticated caller, any role (intended for retest agents; no role gate in code). `pass` closes the ticket (status closed, close_reason `auto_retest`, closed_at and auto_closed_at set); `fail` moves it to `in_review`. Re-callable: each call overwrites the last retest fields. Non-POST returns 405. Note the 405 check runs before the 404 check. Authentication: `X-Api-Key: <key>` or `Authorization: Bearer <key>`; a browser session cookie (from `POST /api/session/login`) is accepted only when no key header is sent. '
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric record id. Not cast or validated by the action; a non-numeric value is handed to the database (behaviour unverified, probably a 500).
          schema:
            type: integer
            minimum: 1
          example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoreRetestResultRequest'
      responses:
        '200':
          description: Updated ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTicketEnvelope'
        '401':
          description: No credentials, or the presented API key does not resolve (unknown, revoked, expired, or owner inactive). A presented key is never combined with a session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not authenticated
        '404':
          description: Unknown record (or unknown endpoint for an authenticated caller).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not found
        '405':
          description: Wrong HTTP method; checked inside the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: POST required
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: result must be 'pass' or 'fail'
        '500':
          description: Uncaught server error (logged server-side).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Internal server error
  /api/tickets/close/{id}:
    post:
      tags:
        - 'Core: Tickets'
      operationId: core_tickets_close
      summary: Manually close a ticket
      description: 'Who: roles admin or operator only (agent and charter_agent get 403). Requires a caller-supplied `close_reason` short code (1-20 bytes). Optional `notes` overwrite the staff-only notes field (never returned). Closing an already closed ticket is allowed and just re-stamps closed_at and close_reason. Check order: method (405), role (403), record (404), validation (422). Authentication: `X-Api-Key: <key>` or `Authorization: Bearer <key>`; a browser session cookie (from `POST /api/session/login`) is accepted only when no key header is sent. '
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric record id. Not cast or validated by the action; a non-numeric value is handed to the database (behaviour unverified, probably a 500).
          schema:
            type: integer
            minimum: 1
          example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoreTicketCloseRequest'
      responses:
        '200':
          description: Closed ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTicketEnvelope'
        '401':
          description: No credentials, or the presented API key does not resolve (unknown, revoked, expired, or owner inactive). A presented key is never combined with a session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not authenticated
        '403':
          description: Authenticated but the role check refused the call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Forbidden
        '404':
          description: Unknown record (or unknown endpoint for an authenticated caller).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not found
        '405':
          description: Wrong HTTP method; checked inside the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: POST required
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: close_reason must be 20 characters or fewer
        '500':
          description: Uncaught server error (logged server-side).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Internal server error
  /api/tickets/self-assign/{id}:
    post:
      tags:
        - 'Core: Tickets'
      operationId: core_tickets_selfAssign
      summary: Claim an unassigned ticket for the caller
      description: 'Who: any authenticated caller, any role (agents included). Assigns the ticket to the calling user. Idempotent when the caller already owns it. Refuses with 409 when it is assigned to someone else. No request body. Non-POST returns 405. Authentication: `X-Api-Key: <key>` or `Authorization: Bearer <key>`; a browser session cookie (from `POST /api/session/login`) is accepted only when no key header is sent. '
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric record id. Not cast or validated by the action; a non-numeric value is handed to the database (behaviour unverified, probably a 500).
          schema:
            type: integer
            minimum: 1
          example: 42
      responses:
        '200':
          description: Ticket now assigned to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTicketEnvelope'
        '401':
          description: No credentials, or the presented API key does not resolve (unknown, revoked, expired, or owner inactive). A presented key is never combined with a session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not authenticated
        '404':
          description: Unknown record (or unknown endpoint for an authenticated caller).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not found
        '405':
          description: Wrong HTTP method; checked inside the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: POST required
        '409':
          description: Already assigned to a different user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Ticket is already assigned to a different user
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Save failed
        '500':
          description: Uncaught server error (logged server-side).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Internal server error
  /api/tickets/reply/{id}:
    post:
      tags:
        - 'Core: Tickets'
      operationId: core_tickets_reply
      summary: Post a public staff reply on a ticket
      description: 'Who: roles admin or operator only (others 403). Public reply, visible to the client that raised the ticket via the messages endpoint (GX-SPEC-05). Does not change the ticket status (a reply on a closed ticket does not reopen it). Idempotency: when `external_ref` is given and a message by the same author on the same ticket already uses it, the original message is returned with `duplicate: true` (HTTP 200) provided visibility and body are identical; if they differ the call is refused with 409. Without `external_ref` every call creates a new message (201). Check order: method (405), role (403), ticket (404), validation (422). Authentication: `X-Api-Key: <key>` or `Authorization: Bearer <key>`; a browser session cookie (from `POST /api/session/login`) is accepted only when no key header is sent. '
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric record id. Not cast or validated by the action; a non-numeric value is handed to the database (behaviour unverified, probably a 500).
          schema:
            type: integer
            minimum: 1
          example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoreTicketMessageRequest'
      responses:
        '200':
          description: 'Duplicate external_ref: the original message.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTicketMessageCreated'
              example:
                message:
                  id: 88
                  ticket_id: 231
                  visibility: public
                  author_label: XTen Support
                  body: We have reproduced this and a fix is queued.
                  created_at: '2026-10-27 10:02:11'
                  external_ref: game-reply-5521
                  author_user_id: 12
                  author_api_key_id: 7
                duplicate: true
        '201':
          description: Message created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTicketMessageCreated'
              example:
                message:
                  id: 88
                  ticket_id: 231
                  visibility: public
                  author_label: XTen Support
                  body: We have reproduced this and a fix is queued.
                  created_at: '2026-10-27 10:02:11'
                  external_ref: game-reply-5521
                  author_user_id: 12
                  author_api_key_id: 7
                duplicate: false
        '401':
          description: No credentials, or the presented API key does not resolve (unknown, revoked, expired, or owner inactive). A presented key is never combined with a session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not authenticated
        '403':
          description: Authenticated but the role check refused the call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Forbidden
        '404':
          description: Unknown record (or unknown endpoint for an authenticated caller).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not found
        '405':
          description: Wrong HTTP method; checked inside the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: POST required
        '409':
          description: external_ref reused for a different message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: external_ref was already used for a different message
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: body is required and must be at most 10000 characters
        '500':
          description: Uncaught server error (logged server-side).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Internal server error
  /api/tickets/note/{id}:
    post:
      tags:
        - 'Core: Tickets'
      operationId: core_tickets_note
      summary: Add an internal staff note to a ticket
      description: 'Who: roles admin or operator only (others 403). Internal note; never returned to non-staff callers by the messages endpoint. Does not change the ticket status (a reply on a closed ticket does not reopen it). Idempotency: when `external_ref` is given and a message by the same author on the same ticket already uses it, the original message is returned with `duplicate: true` (HTTP 200) provided visibility and body are identical; if they differ the call is refused with 409. Without `external_ref` every call creates a new message (201). Check order: method (405), role (403), ticket (404), validation (422). Authentication: `X-Api-Key: <key>` or `Authorization: Bearer <key>`; a browser session cookie (from `POST /api/session/login`) is accepted only when no key header is sent. '
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric record id. Not cast or validated by the action; a non-numeric value is handed to the database (behaviour unverified, probably a 500).
          schema:
            type: integer
            minimum: 1
          example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoreTicketMessageRequest'
      responses:
        '200':
          description: 'Duplicate external_ref: the original message.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTicketMessageCreated'
              example:
                message:
                  id: 88
                  ticket_id: 231
                  visibility: internal
                  author_label: XTen Support
                  body: We have reproduced this and a fix is queued.
                  created_at: '2026-10-27 10:02:11'
                  external_ref: game-reply-5521
                  author_user_id: 12
                  author_api_key_id: 7
                duplicate: true
        '201':
          description: Message created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTicketMessageCreated'
              example:
                message:
                  id: 88
                  ticket_id: 231
                  visibility: internal
                  author_label: XTen Support
                  body: We have reproduced this and a fix is queued.
                  created_at: '2026-10-27 10:02:11'
                  external_ref: game-reply-5521
