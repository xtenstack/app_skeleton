                type: string
        '404':
          description: Unknown or already used token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Invalid or already-used intake link
        '405':
          description: Wrong HTTP method; checked inside the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: POST required
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: intake is required
        '500':
          description: Save failed.
