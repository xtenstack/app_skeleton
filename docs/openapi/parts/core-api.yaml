      operationId: core_provision_users
      summary: Create or update a user by email (idempotent upsert)
      description: 'Who: role admin required (non-admin key gets 403, no credentials 401). Upsert keyed on case-insensitive email. 201 with `created: true` for a new user, 200 with `created: false` when the email existed (name, active flag, primary role and role set are overwritten). The first entry of `role_names` is the primary role (users.role_id). New users get an unusable password hash (agents cannot log in interactively; new `agent` kind users are marked email-verified). Refused: invalid payload (422 `Validation failed` with `errors[]`), unknown role names (422 `Unknown role` with `unknown_roles[]`), granting `admin` (422 via errors[]), and changing an existing user who already holds admin (403). Model save failure is 422 `User could not be saved`; failure saving the role set is 500 `Roles could not be saved`. The user save and role sync are not wrapped in one transaction in code, so a role-sync failure can leave a saved user. Authentication: `X-Api-Key: <key>` or `Authorization: Bearer <key>`; a browser session cookie (from `POST /api/session/login`) is accepted only when no key header is sent. '
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoreProvisionUserRequest'
      responses:
        '200':
          description: Existing user updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreProvisionUserResponse'
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreProvisionUserResponse'
        '401':
          description: No credentials, or the presented API key does not resolve (unknown, revoked, expired, or owner inactive). A presented key is never combined with a session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not authenticated
        '403':
          description: Not admin, or the target user holds admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: An admin user cannot be changed through the provisioning API
        '405':
          description: Wrong HTTP method; checked inside the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: POST required
        '422':
          description: Validation failed, unknown role, or user save failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreProvisionValidationError'
              example:
                error: Validation failed
                errors:
                  - kind must be 'agent' or 'person'
        '500':
          description: Uncaught server error (logged server-side).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Internal server error
  /api/provision/users/{id}/api-key:
    post:
      tags:
        - 'Core: Provision'
      operationId: core_provision_issueKey
      summary: Issue an API key for a user
      description: 'Who: role admin required (non-admin key gets 403, no credentials 401). Key-management policy (`mayManageKeysOf`): users whose email is in the rotate-any list (default claude.code@xten.au, travissaron@xten.au, stack@xten.au; override env PROVISION_ROTATE_ANY_EMAILS, comma separated) may target any user; any other admin may target only users who do NOT hold admin; everyone else is refused with 403. The user must be active (422 otherwise). The plaintext token (`sk_` + 48 hex) is returned once, only a SHA-256 hash is stored, response has `Cache-Control: no-store`. Not idempotent: each call creates another key. Check order: method, admin role, user (404), key policy (403), active (422), label (422), expires_in_days (422). The explicit route takes digits only in the id (the generic route `/api/provision/issue-key/{id}` also reaches the action, where a non-numeric id is cast to 0 and gives 404). Authentication: `X-Api-Key: <key>` or `Authorization: Bearer <key>`; a browser session cookie (from `POST /api/session/login`) is accepted only when no key header is sent. '
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric user id.
          schema:
            type: integer
            minimum: 1
          example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoreProvisionIssueKeyRequest'
      responses:
        '201':
          description: Key issued (token shown once).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreProvisionKeyIssued'
          headers:
            Cache-Control:
              description: '`no-store`'
              schema:
                type: string
        '401':
          description: No credentials, or the presented API key does not resolve (unknown, revoked, expired, or owner inactive). A presented key is never combined with a session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not authenticated
        '403':
          description: Authenticated but the role check refused the call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Forbidden
        '404':
          description: Unknown record (or unknown endpoint for an authenticated caller).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not found
        '405':
          description: Wrong HTTP method; checked inside the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: POST required
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: label is required (at most 100 characters)
        '500':
          description: Uncaught server error (logged server-side).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Internal server error
  /api/provision/users/{id}/rotate-keys:
    post:
      tags:
        - 'Core: Provision'
      operationId: core_provision_rotateKeys
      summary: Rotate any permitted user's keys
      description: 'Who: not role-gated as such (the action only requires a resolvable principal); authorisation is `mayManageKeysOf`. Key-management policy (`mayManageKeysOf`): users whose email is in the rotate-any list (default claude.code@xten.au, travissaron@xten.au, stack@xten.au; override env PROVISION_ROTATE_ANY_EMAILS, comma separated) may target any user; any other admin may target only users who do NOT hold admin; everyone else is refused with 403. Issues a new key (no expiry, label default "rotated by admin") and schedules every other live key of that user to expire at now + `grace_seconds` (never lengthening an existing earlier expiry). Token shown once, `Cache-Control: no-store`. The user must be active. Documented prose (PROVISIONING-API.md) calls this admin-only; in code a non-admin whose email is in the rotate-any list would also pass, and a plain admin rotating their OWN key here is refused (holds admin) despite the 403 message text suggesting otherwise; admins use `/api/provision/api-keys/rotate` for their own. Authentication: `X-Api-Key: <key>` or `Authorization: Bearer <key>`; a browser session cookie (from `POST /api/session/login`) is accepted only when no key header is sent. '
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric user id.
          schema:
            type: integer
            minimum: 1
          example: 42
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoreProvisionRotateKeysRequest'
      responses:
        '201':
          description: New key issued; old keys scheduled to expire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreProvisionRotateKeysResponse'
          headers:
            Cache-Control:
              description: '`no-store`'
              schema:
                type: string
        '401':
          description: No credentials, or the presented API key does not resolve (unknown, revoked, expired, or owner inactive). A presented key is never combined with a session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not authenticated
        '403':
          description: Authenticated but the role check refused the call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Forbidden
        '404':
          description: Unknown record (or unknown endpoint for an authenticated caller).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not found
        '405':
          description: Wrong HTTP method; checked inside the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: POST required
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: grace_seconds must be a whole number from 60 to 3600
        '500':
          description: Uncaught server error (logged server-side).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Internal server error
  /api/provision/users/{id}/deactivate:
    post:
      tags:
        - 'Core: Provision'
      operationId: core_provision_deactivate
      summary: Deactivate a user and revoke all their keys
      description: 'Who: role admin required (non-admin key gets 403, no credentials 401). Sets is_active to 0 and revokes every live key. Refused: deactivating yourself (422) and any user who holds admin (403). Safe to repeat (an already inactive user returns 200 with keys_revoked 0). No request body. Authentication: `X-Api-Key: <key>` or `Authorization: Bearer <key>`; a browser session cookie (from `POST /api/session/login`) is accepted only when no key header is sent. '
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric user id.
          schema:
            type: integer
            minimum: 1
          example: 42
      responses:
        '200':
          description: Deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreProvisionDeactivateResponse'
        '401':
          description: No credentials, or the presented API key does not resolve (unknown, revoked, expired, or owner inactive). A presented key is never combined with a session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not authenticated
        '403':
          description: Authenticated but the role check refused the call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Forbidden
        '404':
          description: Unknown record (or unknown endpoint for an authenticated caller).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not found
        '405':
          description: Wrong HTTP method; checked inside the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: POST required
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: You cannot deactivate yourself
        '500':
          description: Uncaught server error (logged server-side).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Internal server error
  /api/provision/api-keys/rotate:
    post:
      tags:
        - 'Core: Provision'
      operationId: core_provision_rotate
      summary: Rotate the caller's own API key
      description: 'Who: any API-key holder, any role (admins included), for their OWN key only. A browser session is refused with 403 `This endpoint needs an API key, not a session`. Creates a new key for the same user with the same label and no expiry (token shown once, `Cache-Control: no-store`), and sets the calling key to expire after `grace_seconds` (default 600, 60-3600; never lengthens an existing expiry). Follow with `/api/provision/api-keys/confirm` using the NEW key to kill the old one immediately. Not idempotent: each call issues another key. Body is optional. Authentication: `X-Api-Key: <key>` or `Authorization: Bearer <key>`; a browser session cookie (from `POST /api/session/login`) is accepted only when no key header is sent. '
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoreProvisionGraceRequest'
      responses:
        '201':
          description: New key issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreProvisionRotateResponse'
          headers:
            Cache-Control:
              description: '`no-store`'
              schema:
                type: string
        '401':
          description: No credentials, or the presented API key does not resolve (unknown, revoked, expired, or owner inactive). A presented key is never combined with a session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not authenticated
        '403':
          description: Session caller (no API key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: This endpoint needs an API key, not a session
        '405':
          description: Wrong HTTP method; checked inside the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: POST required
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: grace_seconds must be a whole number from 60 to 3600
        '500':
          description: Uncaught server error (logged server-side).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Internal server error
  /api/provision/api-keys/confirm:
    post:
      tags:
        - 'Core: Provision'
      operationId: core_provision_confirm
      summary: 'Confirm a rotation: revoke the superseded key now'
      description: 'Who: any API-key holder, any role, with the NEW key. Revokes every other live key of the same user that has the same label and a non-null expiry (i.e. the keys a rotation scheduled to expire). Keys with no expiry are never touched. Idempotent: repeating returns `revoked: 0`. A session caller gets 403. No request body. Authentication: `X-Api-Key: <key>` or `Authorization: Bearer <key>`; a browser session cookie (from `POST /api/session/login`) is accepted only when no key header is sent. '
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Count of keys revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreProvisionConfirmResponse'
        '401':
          description: No credentials, or the presented API key does not resolve (unknown, revoked, expired, or owner inactive). A presented key is never combined with a session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not authenticated
        '403':
          description: Session caller (no API key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: This endpoint needs an API key, not a session
        '405':
          description: Wrong HTTP method; checked inside the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: POST required
        '500':
          description: Uncaught server error (logged server-side).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Internal server error
  /api/watson/close-offer:
    post:
      tags:
        - 'Core: Watson'
      operationId: core_watson_closeOffer
      summary: Close a published-price offer in Dolibarr (Third Party, Project, order)
      description: 'Who: any authenticated caller, any role (no role gate in code; intended for the Watson-scoped key). Accepts only catalogue offers at their published price (`supported_offers` is returned on an unknown code). For each code it creates a Dolibarr sales order (order-first, no invoice; `invoice_id` is null); the first creates the Third Party and Project, later codes reuse them. If the first order fails the call is 502; if a later one fails it is skipped (logged) and the response lists only the orders that succeeded. NOT idempotent: every call creates a new Third Party, Project and order(s); there is no de-duplication. `price_aud`, when sent, is compared only against the FIRST offer code even for multi-code requests. Non-POST returns 405. Check order: method, offer codes (422), customer fields (422), price (422), Dolibarr (502). The ticket (REQ) is created separately via `/api/tickets/create`. Authentication: `X-Api-Key: <key>` or `Authorization: Bearer <key>`; a browser session cookie (from `POST /api/session/login`) is accepted only when no key header is sent. '
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoreWatsonCloseRequest'
      responses:
        '201':
          description: Order(s) created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreWatsonCloseResponse'
        '401':
          description: No credentials, or the presented API key does not resolve (unknown, revoked, expired, or owner inactive). A presented key is never combined with a session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Not authenticated
        '405':
          description: Wrong HTTP method; checked inside the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: POST required
        '422':
          description: Unknown offer code, missing customer fields, or price mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreWatsonOfferError'
              example:
                error: Unknown or unsupported offer_code
                supported_offers:
                  - DRA
                  - SS
                  - PS
        '500':
          description: Uncaught server error (logged server-side).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Internal server error
        '502':
          description: First Dolibarr order creation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
              example:
                error: Dolibarr close creation failed — see app logs, needs manual follow-up
components:
  schemas:
    CoreError:
      type: object
      required:
        - error
      description: Standard error body used by every endpoint in the core api module. Some errors add extra keys (see CoreProvisionValidationError, CoreWatsonOfferError).
      properties:
        error:
          type: string
      example:
        error: Not authenticated
    CoreProvisionValidationError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Validation failed
        errors:
          type: array
          items:
            type: string
          description: Present for payload validation failures and model save failures.
        unknown_roles:
          type: array
          items:
            type: string
          description: Present when error is "Unknown role".
    CoreWatsonOfferError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        supported_offers:
          type: array
          items:
            type: string
          description: Present on unknown offer_code; the full list of accepted codes.
    CoreSessionUser:
      type: object
      properties:
        id:
          type: integer
          nullable: true
        email:
          type: string
          nullable: true
        role_id:
          type: integer
          nullable: true
          description: Primary role id.
        role_ids:
          type: array
          items:
            type: integer
          description: Full role set.
      example:
        id: 12
        email: operator@example.invalid
        role_id: 2
        role_ids:
          - 2
          - 5
    CoreSessionUserEnvelope:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/CoreSessionUser'
    CoreOk:
      type: object
      properties:
        ok:
          type: boolean
          example: true
    CoreLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      example:
        email: operator@example.invalid
        password: <password>
    CoreTicket:
      type: object
      description: Ticket as returned by the API. Staff-only fields (notes, project, intake data and token) are never returned.
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        severity:
          type: string
          enum:
            - low
            - normal
            - high
            - critical
        ticket_type:
          type: string
          description: Written values are bug, issue, feature or support; other stored values may exist.
        status:
          type: string
          description: 'Seen in code: open, in_review, consolidated, closed.'
        source_ref:
          type: string
          nullable: true
        reporter_user_id:
          type: integer
          nullable: true
        reporter_api_key_id:
          type: integer
          nullable: true
        assigned_to_user_id:
          type: integer
          nullable: true
        consolidated_into_ticket_id:
          type: integer
          nullable: true
        retest_ref:
          type: string
          nullable: true
        retest_agent_key:
          type: string
          nullable: true
        last_retest_result:
          type: string
          nullable: true
          enum:
            - pass
            - fail
            - null
        last_retest_at:
          type: string
          nullable: true
          description: Server local time, Y-m-d H:i:s.
        last_retest_notes:
          type: string
          nullable: true
        closed_at:
          type: string
          nullable: true
        close_reason:
          type: string
          nullable: true
          maxLength: 20
        auto_closed_at:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
          nullable: true
      example:
        id: 231
        title: Directory search returns 500
        description: Steps to reproduce...
        severity: high
        ticket_type: bug
        status: open
        source_ref: dir-search-2026-10-27
        reporter_user_id: 12
        reporter_api_key_id: 7
        assigned_to_user_id: null
        consolidated_into_ticket_id: null
        retest_ref: null
        retest_agent_key: null
        last_retest_result: null
        last_retest_at: null
        last_retest_notes: null
        closed_at: null
        close_reason: null
        auto_closed_at: null
        created_at: '2026-10-27 09:15:02'
        updated_at: '2026-10-27 09:15:02'
    CoreTicketEnvelope:
      type: object
      properties:
        ticket:
          $ref: '#/components/schemas/CoreTicket'
    CoreTicketList:
      type: object
      properties:
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/CoreTicket'
    CoreTicketCreateRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: Trimmed; must be non-empty. No length check in the controller.
        description:
          type: string
        severity:
          type: string
          description: Canonical value (any case) or SLA code S1-S4. Unrecognised values silently become normal.
          enum:
            - low
            - normal
            - high
            - critical
            - S1
            - S2
            - S3
            - S4
        ticket_type:
          type: string
          enum:
            - bug
            - issue
            - feature
            - support
          default: bug
          description: Unrecognised values silently become bug.
        source_ref:
          type: string
          description: Free-form caller reference. Not unique-checked.
        retest_agent_key:
          type: string
        generate_intake_token:
          type: boolean
          description: Any truthy value generates a random single-use intake token, returned once in the response.
      example:
        title: 'Data Restore Audit: Example Pty Ltd'
        description: Customer enquiry via web chat
        severity: high
        ticket_type: support
        source_ref: watson-chat-0001
        generate_intake_token: true
    CoreTicketCreateResponse:
      type: object
      properties:
        ticket:
          $ref: '#/components/schemas/CoreTicket'
        intake_token:
          type: string
          description: 64 hex characters. Only present when generate_intake_token was set; never retrievable again.
    CoreRetestResultRequest:
      type: object
      required:
        - result
      properties:
        result:
          type: string
          enum:
            - pass
            - fail
        notes:
          type: string
      example:
        result: pass
        notes: 'Retest agent: search page now loads.'
    CoreTicketCloseRequest:
      type: object
      required:
        - close_reason
      properties:
        close_reason:
          type: string
          maxLength: 20
          description: Short code, trimmed, 1-20 bytes (strlen).
        notes:
          type: string
          description: Stored on the ticket staff-only notes field; overwrites any existing notes; never returned by the API.
      example:
        close_reason: fixed
        notes: 'Root cause: missing index. Fix: migration 034.'
    CoreTicketMessageRequest:
      type: object
      required:
        - body
      properties:
        body:
          type: string
          maxLength: 10000
          description: Trimmed, non-empty, at most 10000 characters (mb_strlen).
        external_ref:
          type: string
          maxLength: 100
          description: Optional idempotency key, scoped to (ticket, calling user).
      example:
        body: We have reproduced this and a fix is queued.
        external_ref: game-reply-5521
    CoreTicketMessage:
      type: object
      properties:
        id:
          type: integer
        ticket_id:
          type: integer
        visibility:
          type: string
          enum:
            - public
            - internal
        author_label:
          type: string
          description: Always the literal "XTen Support".
          example: XTen Support
        body:
          type: string
        created_at:
          type: string
        external_ref:
          type: string
          nullable: true
          description: Staff view only.
        author_user_id:
          type: integer
          nullable: true
          description: Staff view only.
        author_api_key_id:
          type: integer
          nullable: true
          description: Staff view only.
      example:
        id: 88
        ticket_id: 231
        visibility: public
        author_label: XTen Support
        body: We have reproduced this and a fix is queued.
        created_at: '2026-10-27 10:02:11'
        external_ref: game-reply-5521
        author_user_id: 12
        author_api_key_id: 7
    CoreTicketMessageCreated:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/CoreTicketMessage'
        duplicate:
          type: boolean
          description: True when an identical earlier message with the same external_ref was returned instead of creating a new one (status 200).
    CoreTicketMessages:
      type: object
      properties:
        ticket:
          type: object
          properties:
            id:
              type: integer
            status:
              type: string
            source_ref:
              type: string
              nullable: true
            closed_at:
              type: string
              nullable: true
            close_reason:
              type: string
              nullable: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/CoreTicketMessage'
        last_id:
          type: integer
          description: Id of the last returned message, or the after_id cursor when none were returned (0 if no cursor).
        has_more:
          type: boolean
    CoreKbArticle:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
        summary:
          type: string
          nullable: true
        enquiry_type_id:
          type: integer
          nullable: true
        enquiry_type:
          type: string
          nullable: true
          description: Enquiry type name.
        product_ref:
          type: string
          nullable: true
        visibility:
          type: string
          enum:
            - internal
            - public
        status:
          type: string
          enum:
            - draft
            - published
        published_at:
          type: string
          nullable: true
        created_by_user_id:
          type: integer
          nullable: true
        updated_by_user_id:
          type: integer
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
          nullable: true
      example:
        id: 14
        title: What does a Data Restore Audit include?
        body: Full text...
        summary: Scope of the audit
        enquiry_type_id: 3
        enquiry_type: data-restore
        product_ref: DRA
        visibility: public
        status: published
        published_at: '2026-09-20 08:00:00'
        created_by_user_id: 1
        updated_by_user_id: 1
        created_at: '2026-09-19 12:00:00'
        updated_at: '2026-09-20 08:00:00'
    CoreKbArticleList:
      type: object
      properties:
        articles:
          type: array
          items:
            $ref: '#/components/schemas/CoreKbArticle'
    CoreKbArticleEnvelope:
      type: object
      properties:
        article:
          $ref: '#/components/schemas/CoreKbArticle'
    CoreKbMatchResponse:
      type: object
      description: keyword_match is omitted when the enquiry_type is unknown (body is then just an empty articles array).
      properties:
        articles:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/CoreKbArticle'
        keyword_match:
          type: boolean
          description: True when q was empty or at least one article matched a term; false means the list is the unranked fallback (newest-updated first).
    CoreKbArticleCreateRequest:
      type: object
      required:
        - title
        - enquiry_type_id
      properties:
        title:
          type: string
          description: Trimmed, non-empty.
        enquiry_type_id:
          type: integer
          description: Must reference an existing enquiry type.
        body:
          type: string
          default: ''
        summary:
          type: string
        product_ref:
          type: string
        visibility:
          type: string
          enum:
            - internal
            - public
          default: internal
          description: Any other value silently becomes internal.
      example:
        title: What does a Data Restore Audit include?
        enquiry_type_id: 3
        body: Full text...
        summary: Scope of the audit
        product_ref: DRA
        visibility: public
    CoreKbArticleUpdateRequest:
      type: object
      description: 'Partial update: only keys present are changed.'
      properties:
        title:
          type: string
          description: If present must be non-empty after trimming.
        body:
          type: string
        summary:
          type: string
          nullable: true
        enquiry_type_id:
          type: integer
          description: If present must reference an existing enquiry type.
        product_ref:
          type: string
          nullable: true
        visibility:
          type: string
          enum:
            - internal
            - public
          description: An invalid value is silently ignored (no error).
      example:
        summary: Updated summary
        visibility: public
    CorePublicKbArticle:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        summary:
          type: string
          nullable: true
        body:
          type: string
        enquiry_type:
          type: string
          nullable: true
        product_ref:
          type: string
          nullable: true
        published_at:
          type: string
          nullable: true
    CorePublicKbList:
      type: object
      properties:
        articles:
          type: array
          items:
            $ref: '#/components/schemas/CorePublicKbArticle'
      example:
        articles:
          - id: 14
            title: What does a Data Restore Audit include?
            summary: Scope of the audit
            body: Full text...
            enquiry_type: data-restore
            product_ref: DRA
            published_at: '2026-09-20 08:00:00'
    CoreIntakeRequest:
      type: object
      required:
        - token
        - intake
      properties:
        token:
          type: string
          description: The single-use intake token returned once by ticket creation (generate_intake_token).
        intake:
          type: object
          additionalProperties: true
          minProperties: 1
          description: Free-form non-empty JSON object, stored pretty-printed on the ticket. Keys are defined by the landing page, not by this endpoint.
        company_website:
          type: string
          description: 'Honeypot: any non-empty value makes the call return 200 {"ok":true} without saving.'
      example:
        token: <64-hex-char intake token>
        intake:
          business_name: Example Pty Ltd
          contact_email: owner@example.invalid
          systems: Dolibarr 18, MySQL 8
    CoreProvisionRole:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        assignable:
          type: boolean
          description: False for roles the API will never grant (currently admin).
    CoreProvisionRoleList:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/CoreProvisionRole'
      example:
        roles:
          - id: 1
            name: admin
            assignable: false
          - id: 2
            name: operator
            assignable: true
          - id: 5
            name: agent
            assignable: true
    CoreProvisionUserRequest:
      type: object
      required:
        - email
        - first_name
        - last_name
        - kind
        - role_names
      properties:
        email:
          type: string
          format: email
          maxLength: 150
          description: Lowercased and trimmed; also the upsert key (case-insensitive).
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        kind:
          type: string
          enum:
            - agent
            - person
        role_names:
          type: array
          minItems: 1
          items:
            type: string
          description: De-duplicated, trimmed. First name is the primary role. "admin" is refused.
        active:
          type: boolean
          default: true
          description: Parsed with FILTER_VALIDATE_BOOLEAN, so "false"/"0"/"no" also work.
      example:
        email: tim@example.invalid
        first_name: Tim
        last_name: Agent
        kind: agent
        role_names:
          - agent
          - operator
        active: true
    CoreProvisionUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean
        role_names:
          type: array
          items:
            type: string
          description: Sorted alphabetically (not primary-first).
    CoreProvisionUserResponse:
      type: object
      properties:
        created:
          type: boolean
        kind:
          type: string
          enum:
            - agent
            - person
        user:
          $ref: '#/components/schemas/CoreProvisionUser'
      example:
        created: true
        kind: agent
        user:
          id: 42
          email: tim@example.invalid
          first_name: Tim
          last_name: Agent
          is_active: true
          role_names:
            - agent
            - operator
    CoreProvisionApiKey:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        prefix:
          type: string
          description: First 10 characters of the token.
          example: sk_1a2b3c4d
        expires_at:
          type: string
          nullable: true
        created_at:
          type: string
          nullable: true
    CoreProvisionIssueKeyRequest:
      type: object
      required:
        - label
      properties:
        label:
          type: string
          maxLength: 100
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: Omit or null/empty for no expiry.
      example:
        label: tim prod
        expires_in_days: 90
    CoreProvisionKeyIssued:
      type: object
      properties:
        api_key:
          $ref: '#/components/schemas/CoreProvisionApiKey'
        token:
          type: string
          description: Secret `sk_` + 48 hex characters. Shown once.
        note:
          type: string
      example:
        api_key:
          id: 7
          label: tim prod
          prefix: sk_1a2b3c4d
          expires_at: null
          created_at: '2026-10-28 09:00:00'
        token: sk_<48 hex characters>
        note: The token is shown once and cannot be retrieved again.
    CoreProvisionGraceRequest:
      type: object
      properties:
        grace_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          default: 600
      example:
        grace_seconds: 600
    CoreProvisionRotateKeysRequest:
      type: object
      properties:
        grace_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          default: 600
        label:
          type: string
          maxLength: 100
          default: rotated by admin
      example:
        grace_seconds: 600
        label: tim prod
    CoreProvisionExpiringKey:
      type: object
      properties:
        id:
          type: integer
        expires_at:
          type: string
    CoreProvisionRotateKeysResponse:
      type: object
      properties:
        api_key:
          $ref: '#/components/schemas/CoreProvisionApiKey'
        token:
          type: string
          description: Shown once.
        expiring_keys:
          type: array
          items:
            $ref: '#/components/schemas/CoreProvisionExpiringKey'
          description: Every previously live key of the user with its (possibly shortened) expiry.
        note:
          type: string
    CoreProvisionRotateResponse:
      type: object
      properties:
        api_key:
          $ref: '#/components/schemas/CoreProvisionApiKey'
        token:
          type: string
          description: Shown once.
        old_key:
          $ref: '#/components/schemas/CoreProvisionExpiringKey'
        note:
          type: string
    CoreProvisionDeactivateResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/CoreProvisionUser'
        keys_revoked:
          type: integer
      example:
        user:
          id: 42
          email: tim@example.invalid
          first_name: Tim
          last_name: Agent
          is_active: false
          role_names:
            - agent
        keys_revoked: 2
    CoreProvisionConfirmResponse:
      type: object
      properties:
        revoked:
          type: integer
          description: Number of old keys revoked.
      example:
        revoked: 1
    CoreWatsonCloseRequest:
      type: object
      required:
        - customer_name
      description: Provide offer_code or offer_codes. Provide customer_email (or, as a fallback, customer_contact).
      properties:
        offer_code:
          type: string
          description: One catalogue code (case-insensitive, trimmed, uppercased).
          enum:
            - DRA
            - SS
            - PS
            - CH
            - DM_FLOOR
            - DEP-RESTORE
            - DIR-LIST-FEATURED-M
            - DIR-LIST-FEATURED-Y
            - DIR-LIST-PROMINENT-M
            - DIR-LIST-PROMINENT-Y
            - DIR-VIDEO-30S-ADDON
            - DIR-VIDEO-30S-STANDALONE
            - DIR-BUNDLE-PRO-VID-M
            - DIR-BUNDLE-PRO-VID-Y
            - SRV-DIR-VID30
            - SRV-DIR-VID30-BND
            - SRV-DIR-VID-UPGRADE-TRAVIS
            - PPL-VERIFIED-PRO-M
            - PPL-VERIFIED-PRO-Y
            - PPL-FEATURED-M
            - PPL-FEATURED-Y
        offer_codes:
          type: array
          items:
            type: string
          description: Several codes for one multi-product purchase; de-duplicated, one order each. Takes precedence over offer_code.
        customer_name:
          type: string
        customer_email:
          type: string
          description: Not format-validated.
        customer_contact:
          type: string
          description: Fallback for customer_email.
        price_aud:
          type: number
          description: 'Optional sanity check: must equal the published price of the FIRST offer code, else 422.'
      example:
        offer_code: DRA
        customer_name: Example Pty Ltd
        customer_email: owner@example.invalid
        price_aud: 450
    CoreWatsonOrder:
      type: object
      properties:
        thirdparty_id:
          type: integer
        project_id:
          type: integer
        order_id:
          type: integer
        order_ref:
          type: string
        invoice_id:
          type: integer
          nullable: true
          description: 'Always null: closes are order-first, invoiced only after payment.'
        invoice_ref:
          type: string
          nullable: true
        payment_url:
          type: string
          nullable: true
        offer_code:
          type: string
        offer_name:
          type: string
        price_aud:
          type: number
    CoreWatsonCloseResponse:
      type: object
      properties:
        offer_code:
          type: string
          description: First code.
        offer_codes:
          type: array
          items:
            type: string
        offer_name:
          type: string
          description: Name of the first code.
        price_aud:
          type: number
          description: Sum over orders actually created.
        dolibarr:
          allOf:
            - $ref: '#/components/schemas/CoreWatsonOrder'
          description: The first order created (duplicate of orders[0]).
        orders:
          type: array
          items:
            $ref: '#/components/schemas/CoreWatsonOrder'
      example:
        offer_code: DRA
        offer_codes:
          - DRA
        offer_name: Data Restore Audit
        price_aud: 450
        dolibarr:
          thirdparty_id: 311
          project_id: 90
          order_id: 512
          order_ref: SO2610-0042
          invoice_id: null
          invoice_ref: null
          payment_url: https://example.invalid/pay/abc
          offer_code: DRA
          offer_name: Data Restore Audit
          price_aud: 450
        orders:
          - thirdparty_id: 311
            project_id: 90
            order_id: 512
            order_ref: SO2610-0042
            invoice_id: null
            invoice_ref: null
            payment_url: https://example.invalid/pay/abc
            offer_code: DRA
            offer_name: Data Restore Audit
            price_aud: 450
